services:
  # Backend API avec FFmpeg
  backend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: f4a-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    volumes:
      - .:/app
      - /app/node_modules
      - transcoding_temp:/tmp/f4a-transcoding
    environment:
      NODE_ENV: development
      PORT: 5000
      DATABASE_URL: postgresql://finance4all:finance4All@postgres:5432/finance4All?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_USE_SSL: "false"
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_PUBLIC_URL: http://localhost:9000
      HLS_BUCKET: finance4all-hls
      STREAM_BASE_URL: http://localhost:5000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:5000/api/v1/test"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    profiles:
      - backend

  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: f4a-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: finance4all
      POSTGRES_PASSWORD: finance4All
      POSTGRES_DB: finance4All
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finance4all -d finance4All"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis (for BullMQ job queue)
  redis:
    image: redis:7-alpine
    container_name: f4a-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MinIO Object Storage (S3-compatible)
  minio:
    image: minio/minio:latest
    container_name: f4a-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"   # API
      - "9001:9001"   # Console
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MinIO Client - Create default buckets on startup
  minio-init:
    image: minio/mc:latest
    container_name: f4a-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set myminio http://minio:9000 minioadmin minioadmin;
      mc mb myminio/finance4all-media --ignore-existing;
      mc mb myminio/finance4all-temp --ignore-existing;
      mc mb myminio/finance4all-hls --ignore-existing;
      mc anonymous set download myminio/finance4all-media;
      mc anonymous set download myminio/finance4all-hls;
      echo 'Buckets created successfully';
      exit 0;
      "

  # Redis Commander (optional - Redis GUI)
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: f4a-redis-commander
    restart: unless-stopped
    environment:
      REDIS_HOSTS: local:redis:6379
    ports:
      - "8081:8081"
    depends_on:
      - redis
    profiles:
      - tools

  # pgAdmin (optional - PostgreSQL GUI)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: f4a-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@finance4all.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres
    profiles:
      - tools

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  minio_data:
    driver: local
  pgadmin_data:
    driver: local
  transcoding_temp:
    driver: local

networks:
  default:
    name: f4a-network
