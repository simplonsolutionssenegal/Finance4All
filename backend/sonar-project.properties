sonar.projectKey=simplonsolutionssenegal_finance4all-backend
sonar.organization=simplonsolutionssenegal
sonar.projectName=Finance4All Backend
sonar.projectBaseDir=.

# Sources - FOCUS INSTITUTION ONLY (aligned with Jest config)
sonar.sources=src/application/use-cases/CreateInstitutionFinanciereUseCase.ts,\
src/application/use-cases/DeleteInstitutionFinanciereUseCase.ts,\
src/application/use-cases/GetInstitutionFinanciereByIdUseCase.ts,\
src/application/use-cases/GetPaginatedInstitutionsFinancieresUseCase.ts,\
src/application/validation/InstitutionFinanciereValidator.ts,\
src/infrastructure/database/PrismaInstitutionFinanciereRepository.ts,\
src/infrastructure/database/mappers/institutionFinanciereMapper.ts,\
src/infrastructure/web/controllers/InstitutionFinanciereController.ts,\
src/infrastructure/web/middleware/institutionFinanciere.validation.ts,\
src/infrastructure/web/presenters/InstitutionFinancierePresenter.ts,\
src/infrastructure/web/routes/institutionFinanciere.routes.ts,\
src/utils/pagination.ts

# Tests - FOCUS INSTITUTION ONLY
sonar.tests=__tests__,src/__tests__
sonar.test.inclusions=**/*institution*.test.{js,ts},**/*Institution*.test.{js,ts},**/pagination*.test.{js,ts}

# Exclusions - STANDARD EXCLUSIONS
sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/coverage/**,\
**/*.{config,setup}.{js,ts,mjs,cjs},**/jest.config.{js,ts},**/tsconfig*.json,**/package*.json,\
**/__tests__/**,**/*.spec.{js,ts},**/*.test.{js,ts},**/build-wrapper-dump.json

# Couverture
sonar.coverage.exclusions=**/*.{config,setup}.{js,ts,mjs,cjs},**/jest.config.{js,ts},\
**/tsconfig*.json,**/package*.json,\
**/*.test.{js,ts},**/*.spec.{js,ts},**/__tests__/**/*,**/tests/**/*

sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.lcov.reportPaths=coverage/lcov.info

sonar.sourceEncoding=UTF-8
sonar.qualitygate.wait=true

# D�co PR GitHub
sonar.pullrequest.github.repository=simplonsolutionssenegal/Finance4All
sonar.pullrequest.provider=github
