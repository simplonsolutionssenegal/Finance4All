name: CI/CD Docker + SonarQube + Nexus

on:
  push:
    branches: [ feature/ci-cd ]
  pull_request:
    branches: [ feature/ci-cd ]

env:
  REGISTRY: docker.io
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/simplon-image
  NEXUS_REGISTRY: http://161.97.89.159:8081/repository/npm-hosted/
  NEXUS_IP: 161.97.89.159

jobs:
  build-test:
    name: 🛠 Build, Test & SonarQube
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        if: false  # ← Cette ligne skippe le job
        run: npm test

      - name: Fix package.json
        run: |
          npm pkg fix
          # Suppression explicite du champ 'private'
          npm pkg delete private
          # Vérification manuelle
          if grep -q '"private":' package.json; then
            echo "ERREUR: Le champ 'private' est toujours présent!"
            exit 1
          fi
      
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install SonarScanner
        run: |
             sudo apt-get update
             sudo apt-get install -y unzip openjdk-17-jre
             curl -sSLo sonar-scanner.zip https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-cli-5.0.1.3006-linux.zip
             unzip sonar-scanner.zip
             sudo mv sonar-scanner-5.0.1.3006-linux /opt/sonar-scanner
             sudo ln -s /opt/sonar-scanner/bin/sonar-scanner /usr/local/bin/sonar-scanner

      - name: Run SonarScanner
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          sonar-scanner \
            -Dsonar.projectKey=simplon-finance4all \
            -Dsonar.sources=. \
            -Dsonar.host.url=http://161.97.89.159:9000 \
            -Dsonar.login=sqp_62936974cad76a501878ab9a8a11b4b849e2fe13

  nexus-publish:
    name: 📦 Publish to Nexus
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Configure npm authentication for Nexus
        run: |
          echo "//161.97.89.159:8081/repository/npm-hosted/:username=${{ secrets.NEXUS_USERNAME }}" > ~/.npmrc
          echo "//161.97.89.159:8081/repository/npm-hosted/:_password=$(echo -n '${{ secrets.NEXUS_PASSWORD }}' | base64)" >> ~/.npmrc
          echo "//161.97.89.159:8081/repository/npm-hosted/:email=npm@example.com" >> ~/.npmrc
          echo "registry=http://161.97.89.159:8081/repository/npm-hosted/" >> ~/.npmrc

      - name: Build package
        run: npm pack

      - name: Publish to Nexus
        run: npm publish --registry=http://161.97.89.159:8081/repository/npm-hosted/
