name: CI/CD Docker + SonarQube + Nexus

on:
  push:
    branches: [ feature/ci-cd ]
  pull_request:
    branches: [ feature/ci-cd ]

env:
  REGISTRY: docker.io
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/simplon-image:latest
  NEXUS_REGISTRY: http://161.97.89.159:8081/repository/simplon-finance4all/
  NEXUS_IP: 161.97.89.159

jobs:
  build-test:
    name: 🛠 Build, Test & SonarQube
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        if: false
        run: npm test

      - name: Fix package.json
        run: |
          npm pkg fix
          npm pkg delete private
          if grep -q '"private":' package.json; then
            echo "ERREUR: Le champ 'private' est toujours présent!"
            exit 1
          fi
      
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install SonarScanner
        run: |
             sudo apt-get update
             sudo apt-get install -y unzip openjdk-17-jre
             curl -sSLo sonar-scanner.zip https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-cli-5.0.1.3006-linux.zip
             unzip sonar-scanner.zip
             sudo mv sonar-scanner-5.0.1.3006-linux /opt/sonar-scanner
             sudo ln -s /opt/sonar-scanner/bin/sonar-scanner /usr/local/bin/sonar-scanner

      - name: Run SonarScanner
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          sonar-scanner \
            -Dsonar.projectKey=simplon-finance4all \
            -Dsonar.sources=. \
            -Dsonar.host.url=http://161.97.89.159:9000 \
            -Dsonar.login=${{ secrets.SONAR_TOKEN }}

  docker-build-push:
    name: 🐳 Build, Scan & Push Docker Image
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Build Docker image
        run: docker build -t $IMAGE_NAME .

      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: $IMAGE_NAME
          severity: HIGH,CRITICAL
          exit-code: 1
          format: table

      - name: Push Docker image
        if: success()
        run: docker push $IMAGE_NAME

  nexus-publish:
    name: 📦 Publish to Nexus
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Configure .npmrc for Nexus
        run: |
          AUTH=$(echo -n "${{ secrets.NEXUS_USER }}:${{ secrets.NEXUS_PASSWORD }}" | base64)
          echo "//161.97.89.159:8081/repository/simplon-finance4all/:_auth=$AUTH" > ~/.npmrc
          echo "registry=http://161.97.89.159:8081/repository/simplon-finance4all/" >> ~/.npmrc
          echo "//161.97.89.159:8081/repository/simplon-finance4all/:always-auth=true" >> ~/.npmrc
          cat ~/.npmrc

      - name: Build package
        run: |
          npm install
          npm pack

      - name: 🔍 Scan package with Trivy FS
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          dir: .
          severity: HIGH,CRITICAL
          exit-code: 1
          format: table

      - name: Publish package to Nexus
        if: success()
        run: npm publish --registry=http://161.97.89.159:8081/repository/simplon-finance4all/
