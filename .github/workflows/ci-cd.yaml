name: CI/CD Docker + SonarQube + Nexus

on:
  push:
    branches: [ feature/ci-cd ]
  pull_request:
    branches: [ feature/ci-cd ]

env:
  REGISTRY: docker.io
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/simplon-image
  IMAGE_TAG: latest
  NEXUS_REGISTRY: ${{ secrets.NEXUS_URL }}/repository/simplon-finance4all/
  NEXUS_IP: ${{ secrets.NEXUS_IP }}

jobs:
  test:
    name: ✅ Run Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        if: false
        run: npm test

  build:
    name: 🛠 Build Project
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - run: npm ci
      - run: |
          npm pkg fix
          npm pkg delete private

  sonar:
    name: 📊 SonarQube Analysis
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - run: |
          curl -sSLo sonar-scanner.zip https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-cli-5.0.1.3006-linux.zip
          unzip sonar-scanner.zip
          sudo mv sonar-scanner-5.0.1.3006-linux /opt/sonar-scanner
          sudo ln -s /opt/sonar-scanner/bin/sonar-scanner /usr/local/bin/sonar-scanner
      - env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          sonar-scanner \
            -Dsonar.projectKey=simplon-finance4all \
            -Dsonar.sources=. \
            -Dsonar.host.url="${{ secrets.SONAR_HOST_URL }}" \
            -Dsonar.login="${{ secrets.SONAR_PASSWORD }}"

  docker:
    name: 🐳 Build, Scan & Push Docker Image
    runs-on: ubuntu-latest
    needs: sonar
    steps:
      - uses: actions/checkout@v4

      - name: Login to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Build Docker image
        run: docker build -t $REGISTRY/${{ secrets.DOCKERHUB_USERNAME }}/simplon-image:$IMAGE_TAG -f Dockerfile .

      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ secrets.DOCKERHUB_USERNAME }}/simplon-image:${{ env.IMAGE_TAG }}
          severity: HIGH,CRITICAL
          format: table

      - name: Push Docker image (tag latest)
        run: docker push $REGISTRY/${{ secrets.DOCKERHUB_USERNAME }}/simplon-image:$IMAGE_TAG

  nexus:
    name: 📦 Publish Package to Nexus
    runs-on: ubuntu-latest
    needs: docker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Configure .npmrc for Nexus
        run: |
          AUTH=$(echo -n "${{ secrets.NEXUS_USER }}:${{ secrets.NEXUS_PASSWORD }}" | base64)
          echo "//${{ env.NEXUS_IP }}:8081/repository/simplon-finance4all/:_auth=$AUTH" > ~/.npmrc
          echo "registry=${{ env.NEXUS_REGISTRY }}" >> ~/.npmrc
          echo "//${{ env.NEXUS_IP }}:8081/repository/simplon-finance4all/:always-auth=true" >> ~/.npmrc
      - name: Build package
        run: |
          npm install
          npm pack
      - name: 🔍 Scan package with Trivy FS
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          dir: .
          severity: HIGH,CRITICAL
          exit-code: 1
          format: table
      - name: Publish package to Nexus
        run: npm publish --registry=${{ env.NEXUS_REGISTRY }}
