name: CI/CD Pipeline

on:
  push:
    branches: [ feature/ci-cd ]
  pull_request:
    branches: [ feature/ci-cd ]

env:
  REGISTRY: docker.io
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/simplon-image:latest
  NEXUS_REGISTRY: http://161.97.89.159:8081/repository/simplon-finance4all/
  NEXUS_IP: 161.97.89.159

jobs:
  test:
    name: ✅ Run Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
      - run: npm ci
      - name: Run tests
        if: false
        run: npm test


  build:
    name: 🛠 Build Project
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - run: npm pkg fix && npm pkg delete private

  sonar:
    name: 📊 SonarQube Analysis
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - run: |
          curl -sSLo sonar-scanner.zip https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-cli-5.0.1.3006-linux.zip
          unzip sonar-scanner.zip
          sudo mv sonar-scanner-5.0.1.3006-linux /opt/sonar-scanner
          sudo ln -s /opt/sonar-scanner/bin/sonar-scanner /usr/local/bin/sonar-scanner
      - env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          sonar-scanner \
            -Dsonar.projectKey=simplon-finance4all \
            -Dsonar.sources=. \
            -Dsonar.host.url=http://161.97.89.159:9000 \
            -Dsonar.login=${{ secrets.SONAR_TOKEN }}

  docker:
    name: 🐳 Build & Scan Docker Image
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}
      - run: docker build -t $IMAGE_NAME -f Dockerfile .
      - uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE_NAME }}
          severity: HIGH,CRITICAL
          format: table
      - run: docker push $IMAGE_NAME

  nexus:
    name: 📦 Publish Package to Nexus
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - run: |
          AUTH=$(echo -n "${{ secrets.NEXUS_USER }}:${{ secrets.NEXUS_PASSWORD }}" | base64)
          echo "//${{ env.NEXUS_IP }}:8081/repository/simplon-finance4all/:_auth=$AUTH" > ~/.npmrc
          echo "registry=${{ env.NEXUS_REGISTRY }}" >> ~/.npmrc
          echo "//${{ env.NEXUS_IP }}:8081/repository/simplon-finance4all/:always-auth=true" >> ~/.npmrc
      - run: npm pack
      - uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          dir: .
          severity: HIGH,CRITICAL
          exit-code: 1
          format: table
      - run: npm publish --registry=${{ env.NEXUS_REGISTRY }}
