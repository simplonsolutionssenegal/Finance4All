name: Clean Previews

on:
  pull_request:
    types:
      - closed

jobs:
  delete_preview:
    name: Delete all preview's items
    runs-on: self-hosted
    
    steps:
      - name: Delete preview namespace
        run: |
          kubectl delete namespace preview-pr-${{ github.event.pull_request.number }} --ignore-not-found=true

      - name: Login to Nexus Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.NEXUS_REGISTRY_URL }}
          username: ${{ secrets.NEXUS_USERNAME }}
          password: ${{ secrets.NEXUS_PASSWORD }}

      - name: Delete preview Docker images
        run: |
          # Supprimer les images frontend
          docker rmi ${{ secrets.NEXUS_REGISTRY_URL }}/finance4all-frontend:preview-${{ github.event.pull_request.number }} || true
          docker rmi ${{ secrets.NEXUS_REGISTRY_URL }}/finance4all-frontend:preview-${{ github.event.pull_request.head.sha }} || true
          
          # Supprimer les images backend
          docker rmi ${{ secrets.NEXUS_REGISTRY_URL }}/finance4all-backend:preview-${{ github.event.pull_request.number }} || true
          docker rmi ${{ secrets.NEXUS_REGISTRY_URL }}/finance4all-backend:preview-${{ github.event.pull_request.head.sha }} || true

      - name: Comment PR cleanup
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.payload.pull_request.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `🧹 **Preview nettoyé !**
              
              Les ressources suivantes ont été supprimées :
              - Namespace Kubernetes : \`preview-pr-${{ github.event.pull_request.number }}\`
              - Images Docker frontend et backend
              
              _Nettoyage automatique effectué suite à la fermeture de la PR._`
            });