name: Preview

on:
  issue_comment:
    types: [ created ]

permissions:
  issues: write
  pull-requests: write
  contents: read
  actions: read
  packages: write

jobs:
  check-preview-request:
    if: ${{ github.event.issue.pull_request && contains(github.event.comment.body, '/preview') }}
    name: Check Preview Request
    runs-on: ubuntu-latest
    outputs:
      pr-ref: ${{ steps.pr-details.outputs.ref }}
      pr-sha: ${{ steps.pr-details.outputs.sha }}
      pr-number: ${{ steps.pr-details.outputs.number }}

    steps:
      - name: Get PR details
        id: pr-details
        uses: actions/github-script@v7
        with:
          script: |
            const { data: pullRequest } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number
            });
            core.setOutput('ref', pullRequest.head.ref);
            core.setOutput('sha', pullRequest.head.sha);
            core.setOutput('number', context.issue.number);

      - name: React to comment
        uses: actions/github-script@v7
        with:
          script: |
            const { data: pullRequest } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number
            });

            await Promise.all([
              github.rest.reactions.createForIssueComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: context.payload.comment.id,
                content: 'rocket'
              }),
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: `🚀 **Preview deployment initiated** by @${context.actor}!\n\nDeploying commit \`${pullRequest.head.sha}\`...\n\n[View deployment logs](${context.payload.repository.html_url}/actions/runs/${context.runId})`
              })
            ]);

  run-ci:
    name: Run CI Tests
    needs: check-preview-request
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  # ============================================
  # BUILD & PUSH DOCKER IMAGES
  # ============================================
  build-images:
    name: Build & Push Images
    runs-on: self-hosted
    needs: [ check-preview-request, run-ci ]
    if: needs.run-ci.outputs.build-success == 'true'
    timeout-minutes: 20
    env:
      PR_NUMBER: ${{ needs.check-preview-request.outputs.pr-number }}
      PR_SHA: ${{ needs.check-preview-request.outputs.pr-sha }}

    steps:
      - name: Set repository name to lowercase
        run: echo "REPO_LOWER=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.check-preview-request.outputs.pr-ref }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.REPO_LOWER }}/backend:pr-${{ env.PR_NUMBER }}
            ghcr.io/${{ env.REPO_LOWER }}/backend:pr-${{ env.PR_NUMBER }}-${{ env.PR_SHA }}
          cache-from: type=registry,ref=ghcr.io/${{ env.REPO_LOWER }}/backend:pr-${{ env.PR_NUMBER }}-cache
          cache-to: type=registry,ref=ghcr.io/${{ env.REPO_LOWER }}/backend:pr-${{ env.PR_NUMBER }}-cache,mode=max
          build-args: |
            NODE_ENV=preview
            COMMIT_SHA=${{ env.PR_SHA }}
            BUILD_DATE=${{ github.run_number }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.REPO_LOWER }}/frontend:pr-${{ env.PR_NUMBER }}
            ghcr.io/${{ env.REPO_LOWER }}/frontend:pr-${{ env.PR_NUMBER }}-${{ env.PR_SHA }}
          cache-from: type=registry,ref=ghcr.io/${{ env.REPO_LOWER }}/frontend:pr-${{ env.PR_NUMBER }}-cache
          cache-to: type=registry,ref=ghcr.io/${{ env.REPO_LOWER }}/frontend:pr-${{ env.PR_NUMBER }}-cache,mode=max
          build-args: |
            NEXT_PUBLIC_API_URL=https://api-pr-${{ env.PR_NUMBER }}.finance4all.simplonprojet.com/api/v1
            COMMIT_SHA=${{ env.PR_SHA }}
            BUILD_DATE=${{ github.run_number }}

  # ============================================
  # CREATE/UPDATE REVIEW APPS + SYNC SECRETS + DEPLOY
  # ============================================
  deploy-preview:
    name: Deploy Review Apps
    runs-on: ubuntu-latest
    needs: [ check-preview-request, build-images ]
    timeout-minutes: 15
    env:
      PR_NUMBER: ${{ needs.check-preview-request.outputs.pr-number }}
      PR_SHA: ${{ needs.check-preview-request.outputs.pr-sha }}
      INFISICAL_URL: https://secrets.nehiyr-tech.dev

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.check-preview-request.outputs.pr-ref }}

      - name: Set repository name to lowercase
        run: echo "REPO_LOWER=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Authenticate to Infisical
        env:
          INFISICAL_CLIENT_ID: ${{ secrets.INFISICAL_CLIENT_ID }}
          INFISICAL_CLIENT_SECRET: ${{ secrets.INFISICAL_CLIENT_SECRET }}
        run: bash .github/scripts/infisical-auth.sh

      - name: Create or update review apps & deploy
        env:
          COOLIFY_URL: ${{ secrets.COOLIFY_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          COOLIFY_PROJECT_UUID: ${{ secrets.COOLIFY_PROJECT_UUID }}
          COOLIFY_SERVER_UUID: ${{ secrets.COOLIFY_SERVER_UUID }}
          INFISICAL_PROJECT_ID: ${{ secrets.INFISICAL_PROJECT_ID }}
          INFISICAL_INFRA_ID: ${{ secrets.INFISICAL_INFRA_ID }}
        run: |
          set -euo pipefail

          BACKEND_APP_NAME="review-f4a-backend-pr-${PR_NUMBER}"
          FRONTEND_APP_NAME="review-f4a-frontend-pr-${PR_NUMBER}"
          BACKEND_DOMAIN="api-pr-${PR_NUMBER}.finance4all.simplonprojet.com"
          FRONTEND_DOMAIN="pr-${PR_NUMBER}.finance4all.simplonprojet.com"
          BACKEND_IMAGE="ghcr.io/${REPO_LOWER}/backend"
          FRONTEND_IMAGE="ghcr.io/${REPO_LOWER}/frontend"
          IMAGE_TAG="pr-${PR_NUMBER}"

          # -----------------------------------------------
          # Fonction : créer ou mettre à jour une review app
          # -----------------------------------------------
          deploy_review_app() {
            local APP_NAME=$1
            local DOMAIN=$2
            local IMAGE_NAME=$3
            local IMAGE_TAG=$4
            local PORT=$5
            local LABEL=$6

            echo "🔍 Recherche review app : ${APP_NAME}"

            EXISTING_UUID=$(curl -s -X GET "${COOLIFY_URL}/api/v1/applications" \
              -H "Authorization: Bearer ${COOLIFY_TOKEN}" \
              | jq -r --arg name "${APP_NAME}" '.[] | select(.name == $name) | .uuid // empty')

            if [ -n "$EXISTING_UUID" ]; then
              echo "♻️  ${LABEL} trouvée (${EXISTING_UUID}) — mise à jour image"

              curl -s -X PATCH "${COOLIFY_URL}/api/v1/applications/${EXISTING_UUID}" \
                -H "Authorization: Bearer ${COOLIFY_TOKEN}" \
                -H "Content-Type: application/json" \
                -d "{
                  \"docker_registry_image_name\": \"${IMAGE_NAME}\",
                  \"docker_registry_image_tag\": \"${IMAGE_TAG}\"
                }"

              echo "${EXISTING_UUID}"
            else
              echo "🆕 Création review app : ${APP_NAME}"

              RESPONSE=$(curl -s -X POST "${COOLIFY_URL}/api/v1/applications/dockerimage" \
                -H "Authorization: Bearer ${COOLIFY_TOKEN}" \
                -H "Content-Type: application/json" \
                -d "{
                  \"project_uuid\": \"${COOLIFY_PROJECT_UUID}\",
                  \"server_uuid\": \"${COOLIFY_SERVER_UUID}\",
                  \"environment_name\": \"preview\",
                  \"docker_registry_image_name\": \"${IMAGE_NAME}\",
                  \"docker_registry_image_tag\": \"${IMAGE_TAG}\",
                  \"name\": \"${APP_NAME}\",
                  \"description\": \"Review app ${LABEL} PR #${PR_NUMBER}\",
                  \"domains\": \"https://${DOMAIN}\",
                  \"ports_exposes\": \"${PORT}\",
                  \"instant_deploy\": false
                }")

              NEW_UUID=$(echo "$RESPONSE" | jq -r '.uuid // empty')

              if [ -z "$NEW_UUID" ]; then
                echo "❌ Échec création ${LABEL}"
                echo "$RESPONSE" | jq .
                exit 1
              fi

              echo "✅ ${LABEL} créée : ${NEW_UUID}"
              echo "${NEW_UUID}"
            fi
          }

          # -----------------------------------------------
          # 1. Create/update backend review app
          # -----------------------------------------------
          echo ""
          echo "========== BACKEND =========="
          BACKEND_UUID=$(deploy_review_app "${BACKEND_APP_NAME}" "${BACKEND_DOMAIN}" "${BACKEND_IMAGE}" "${IMAGE_TAG}" "3001" "Backend")
          sleep 2

          # -----------------------------------------------
          # 2. Create/update frontend review app
          # -----------------------------------------------
          echo ""
          echo "========== FRONTEND =========="
          FRONTEND_UUID=$(deploy_review_app "${FRONTEND_APP_NAME}" "${FRONTEND_DOMAIN}" "${FRONTEND_IMAGE}" "${IMAGE_TAG}" "3000" "Frontend")
          sleep 2

          # -----------------------------------------------
          # 3. Sync secrets from Infisical → Coolify
          # -----------------------------------------------
          echo ""
          echo "🔄 Syncing secrets..."

          # Backend: Infrastructure + Finance4All secrets
          bash .github/scripts/infisical-coolify-sync.sh \
            "${INFISICAL_INFRA_ID}" "dev" "${BACKEND_UUID}" "Infrastructure → Backend"
          bash .github/scripts/infisical-coolify-sync.sh \
            "${INFISICAL_PROJECT_ID}" "dev" "${BACKEND_UUID}" "Finance4All → Backend"

          # Frontend: Finance4All secrets only
          bash .github/scripts/infisical-coolify-sync.sh \
            "${INFISICAL_PROJECT_ID}" "dev" "${FRONTEND_UUID}" "Finance4All → Frontend"

          # Inject preview-specific env vars
          for UUID in "${BACKEND_UUID}" "${FRONTEND_UUID}"; do
            curl -s -X POST "${COOLIFY_URL}/api/v1/applications/${UUID}/envs" \
              -H "Authorization: Bearer ${COOLIFY_TOKEN}" \
              -H "Content-Type: application/json" \
              -d "{\"key\": \"NODE_ENV\", \"value\": \"preview\", \"is_preview\": false}" || true

            curl -s -X POST "${COOLIFY_URL}/api/v1/applications/${UUID}/envs" \
              -H "Authorization: Bearer ${COOLIFY_TOKEN}" \
              -H "Content-Type: application/json" \
              -d "{\"key\": \"PR_NUMBER\", \"value\": \"${PR_NUMBER}\", \"is_preview\": false}" || true
          done

          # Backend-specific preview vars
          curl -s -X POST "${COOLIFY_URL}/api/v1/applications/${BACKEND_UUID}/envs" \
            -H "Authorization: Bearer ${COOLIFY_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "{\"key\": \"FRONTEND_URL\", \"value\": \"https://${FRONTEND_DOMAIN}\", \"is_preview\": false}" || true

          curl -s -X POST "${COOLIFY_URL}/api/v1/applications/${BACKEND_UUID}/envs" \
            -H "Authorization: Bearer ${COOLIFY_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "{\"key\": \"PORT\", \"value\": \"3001\", \"is_preview\": false}" || true

          # Frontend-specific preview vars
          curl -s -X POST "${COOLIFY_URL}/api/v1/applications/${FRONTEND_UUID}/envs" \
            -H "Authorization: Bearer ${COOLIFY_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "{\"key\": \"NEXT_PUBLIC_API_URL\", \"value\": \"https://${BACKEND_DOMAIN}/api/v1\", \"is_preview\": false}" || true

          echo "✅ Secrets synchronisés"

          # -----------------------------------------------
          # 4. Deploy both apps
          # -----------------------------------------------
          echo ""
          echo "🚀 Deploying review apps..."

          curl -s -X GET "${COOLIFY_URL}/api/v1/deploy?uuid=${BACKEND_UUID}&force=false" \
            -H "Authorization: Bearer ${COOLIFY_TOKEN}"

          curl -s -X GET "${COOLIFY_URL}/api/v1/deploy?uuid=${FRONTEND_UUID}&force=false" \
            -H "Authorization: Bearer ${COOLIFY_TOKEN}"

          echo "✅ Déploiements déclenchés"

      - name: Comment PR with preview URLs
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = ${{ needs.check-preview-request.outputs.pr-number }};

            github.rest.issues.createComment({
              issue_number: prNumber,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `✅ **Preview deployment successful!**

            🌐 **Frontend**: https://pr-${prNumber}.finance4all.simplonprojet.com
            🔧 **Backend API**: https://api-pr-${prNumber}.finance4all.simplonprojet.com

            📦 **Docker Images**:
            - Frontend: \`ghcr.io/${{ env.REPO_LOWER }}/frontend:pr-${prNumber}\`
            - Backend: \`ghcr.io/${{ env.REPO_LOWER }}/backend:pr-${prNumber}\`

            🔄 To update this preview, push new commits or comment \`/preview\` again.
            🗑️ To cleanup, comment \`/cleanup\` on this PR.`
            });

  notify-failure:
    name: Notify Failure
    runs-on: ubuntu-latest
    needs: [ check-preview-request, run-ci, build-images, deploy-preview ]
    if: failure()

    steps:
      - name: Comment PR with failure
        uses: actions/github-script@v7
        with:
          script: |
            let msg = "❌ **Preview deployment failed!**\n\n";
            msg += "Check the logs here:\n";
            msg += `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            github.rest.issues.createComment({
              issue_number: ${{ needs.check-preview-request.outputs.pr-number }},
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: msg
            });
