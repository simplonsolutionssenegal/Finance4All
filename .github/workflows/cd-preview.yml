name: Preview

on:
  issue_comment:
    types: [created]

permissions:
  issues: write
  pull-requests: write
  contents: read
  actions: read
  packages: write

jobs:
  check-preview-request:
    if: ${{ github.event.issue.pull_request && contains(github.event.comment.body, '/preview') }}
    name: Check Preview Request
    runs-on: ubuntu-latest
    outputs:
      pr-ref: ${{ steps.pr-details.outputs.ref }}
      pr-sha: ${{ steps.pr-details.outputs.sha }}
      pr-number: ${{ steps.pr-details.outputs.number }}

    steps:
      - name: Get PR details
        id: pr-details
        uses: actions/github-script@v7
        with:
          script: |
            const { data: pullRequest } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number
            });
            core.setOutput('ref', pullRequest.head.ref);
            core.setOutput('sha', pullRequest.head.sha);
            core.setOutput('number', context.issue.number);

      - name: React to comment
        uses: actions/github-script@v7
        with:
          script: |
            const { data: pullRequest } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number
            });

            await Promise.all([
              github.rest.reactions.createForIssueComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: context.payload.comment.id,
                content: 'rocket'
              }),
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: `🚀 **Preview deployment initiated** by @${context.actor}!\n\nDeploying commit \`${pullRequest.head.sha}\`...\n\n[View deployment logs](${context.payload.repository.html_url}/actions/runs/${context.runId})`
              })
            ]);

  run-ci:
    name: Run CI Tests
    needs: check-preview-request
    uses: ./.github/workflows/ci.yml
    secrets: inherit


  build-and-deploy:
    name: Build Images & Deploy Preview
    runs-on: self-hosted
    needs: [check-preview-request, run-ci]
    if: needs.run-ci.outputs.build-success == 'true'
    timeout-minutes: 30
    env:
      PR_NUMBER: ${{ needs.check-preview-request.outputs.pr-number }}

    steps:
      - name: Set repository name to lowercase
        id: repo-name
        run: echo "REPO_LOWER=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Check runner health
        run: |
          echo "Runner hostname: $(hostname)"
          df -h
          free -h || vm_stat
          docker --version
          docker info

      - name: Cleanup old Docker resources
        continue-on-error: true
        run: |
          docker system prune -f
          docker image prune -a -f --filter "until=72h"

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.check-preview-request.outputs.pr-ref }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}


      # --------------------------------------------------
      # Build and push BACKEND image
      # --------------------------------------------------
      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.REPO_LOWER }}/backend:pr-${{ needs.check-preview-request.outputs.pr-number }}
            ghcr.io/${{ env.REPO_LOWER }}/backend:pr-${{ needs.check-preview-request.outputs.pr-number }}-${{ needs.check-preview-request.outputs.pr-sha }}
          cache-from: type=registry,ref=ghcr.io/${{ env.REPO_LOWER }}/backend:pr-${{ needs.check-preview-request.outputs.pr-number }}-cache
          cache-to: type=registry,ref=ghcr.io/${{ env.REPO_LOWER }}/backend:pr-${{ needs.check-preview-request.outputs.pr-number }}-cache,mode=max
          build-args: |
            NODE_ENV=preview
            COMMIT_SHA=${{ needs.check-preview-request.outputs.pr-sha }}
            BUILD_DATE=${{ github.run_number }}

      # --------------------------------------------------
      # Build and push FRONTEND image
      # --------------------------------------------------
      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.REPO_LOWER }}/frontend:pr-${{ needs.check-preview-request.outputs.pr-number }}
            ghcr.io/${{ env.REPO_LOWER }}/frontend:pr-${{ needs.check-preview-request.outputs.pr-number }}-${{ needs.check-preview-request.outputs.pr-sha }}
          cache-from: type=registry,ref=ghcr.io/${{ env.REPO_LOWER }}/frontend:pr-${{ needs.check-preview-request.outputs.pr-number }}-cache
          cache-to: type=registry,ref=ghcr.io/${{ env.REPO_LOWER }}/frontend:pr-${{ needs.check-preview-request.outputs.pr-number }}-cache,mode=max
          build-args: |
            NEXT_PUBLIC_API_URL=https://api-pr-${{ needs.check-preview-request.outputs.pr-number }}.finance4all.simplonprojet.com/api/v1
            NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
            CLERK_SECRET_KEY=${{ secrets.CLERK_SECRET_KEY }}
            COMMIT_SHA=${{ needs.check-preview-request.outputs.pr-sha }}
            BUILD_DATE=${{ github.run_number }}


      # --------------------------------------------------
      # SAFE REMOVE ONLY THIS PR’S IMAGES (bug fixed!)
      # --------------------------------------------------
      - name: Stop and remove old preview environment (safe)
        continue-on-error: true
        run: |
          PR_TAG="pr-${{ needs.check-preview-request.outputs.pr-number }}"
          REPO="${REPO_LOWER}"

          echo "🛑 Stopping containers for ${PR_TAG}..."
          docker compose -f docker-compose.preview.yml --env-file .env.preview down --remove-orphans

          echo "🗑 Removing ONLY images for ${PR_TAG}..."

          # Backend exact matches
          docker images --format "{{.Repository}}:{{.Tag}}" \
            | grep "^ghcr.io/${REPO}/backend:${PR_TAG}$" \
            | xargs -r docker rmi -f

          docker images --format "{{.Repository}}:{{.Tag}}" \
            | grep "^ghcr.io/${REPO}/backend:${PR_TAG}-" \
            | xargs -r docker rmi -f

          # Frontend exact matches
          docker images --format "{{.Repository}}:{{.Tag}}" \
            | grep "^ghcr.io/${REPO}/frontend:${PR_TAG}$" \
            | xargs -r docker rmi -f

          docker images --format "{{.Repository}}:{{.Tag}}" \
            | grep "^ghcr.io/${REPO}/frontend:${PR_TAG}-" \
            | xargs -r docker rmi -f

          echo "Pulling fresh images..."
          docker pull ghcr.io/${REPO}/backend:${PR_TAG}
          docker pull ghcr.io/${REPO}/frontend:${PR_TAG}


      # --------------------------------------------------
      # DEPLOY PREVIEW
      # --------------------------------------------------
      - name: Create .env file
        run: |
          cat > .env.preview <<EOF
          PR_NUMBER=${{ needs.check-preview-request.outputs.pr-number }}
          GITHUB_REPOSITORY=${REPO_LOWER}
          POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
          CLERK_PUBLISHABLE_KEY=${{ secrets.CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY=${{ secrets.CLERK_SECRET_KEY }}
          CLERK_WEBHOOK_SECRET=${{ secrets.CLERK_WEBHOOK_SECRET }}
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          GMAIL_USER=${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD=${{ secrets.GMAIL_APP_PASSWORD }}
          FROM_EMAIL=${{ secrets.FROM_EMAIL }}
          FROM_NAME=${{ secrets.FROM_NAME }}
          EOF

      - name: Deploy preview with docker-compose
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        run: |
          docker compose -f docker-compose.preview.yml --env-file .env.preview up -d

      - name: Wait for services to be healthy
        run: |
          timeout 120 sh -c 'until docker compose -f docker-compose.preview.yml ps | grep -q "healthy"; do sleep 5; done' || echo "Health check timeout"


      # --------------------------------------------------
      # COMMENT PR WITH PREVIEW URL
      # --------------------------------------------------
      - name: Comment PR
        uses: actions/github-script@v7
        with:
          script: |
            const pr = ${{ needs.check-preview-request.outputs.pr-number }};
            const repo = process.env.REPO_LOWER;

            github.rest.issues.createComment({
              issue_number: pr,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `✅ **Preview deployed successfully!**

🌐 Frontend → https://pr-${pr}.finance4all.simplonprojet.com  
🔧 Backend → https://api-pr-${pr}.finance4all.simplonprojet.com  

📦 Docker images:
- frontend: \`ghcr.io/${repo}/frontend:pr-${pr}\`
- backend: \`ghcr.io/${repo}/backend:pr-${pr}\`

🔄 Update preview: comment \`/preview\`  
🗑 Cleanup: comment \`/cleanup\``
            });


  notify-failure:
    name: Notify Failure
    runs-on: ubuntu-latest
    needs: [check-preview-request, run-ci, build-and-deploy]
    if: failure()

    steps:
      - name: Comment PR with failure
        uses: actions/github-script@v7
        with:
          script: |
            let msg = "❌ **Preview deployment failed!**\n\n";
            msg += "Check the logs here:\n";
            msg += `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            github.rest.issues.createComment({
              issue_number: ${{ needs.check-preview-request.outputs.pr-number }},
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: msg
            });


