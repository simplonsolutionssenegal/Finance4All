name: Preview

on:
  issue_comment:
    types: [created]

permissions:
  issues: write
  pull-requests: write
  contents: read
  actions: read

jobs:
  check-preview-request:
    if: ${{ github.event.issue.pull_request && contains(github.event.comment.body, '/preview') }}
    name: Check Preview Request
    runs-on: ubuntu-latest
    outputs:
      pr-ref: ${{ steps.pr-details.outputs.ref }}
      pr-sha: ${{ steps.pr-details.outputs.sha }}
      pr-number: ${{ steps.pr-details.outputs.number }}
    
    steps:
      - name: Get PR details
        uses: actions/github-script@v7
        id: pr-details
        with:
          script: |
            const { data: pullRequest } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number
            });
            core.setOutput('ref', pullRequest.head.ref);
            core.setOutput('sha', pullRequest.head.sha);
            core.setOutput('number', context.issue.number);

      - name: React to comment (optimized)
        uses: actions/github-script@v7
        with:
          script: |
            const { data: pullRequest } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number
            });
            
            // Opérations parallèles
            await Promise.all([
              github.rest.reactions.createForIssueComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: context.payload.comment.id,
                content: 'rocket'
              }),
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: `🚀 **Preview deployment initiated** by @${context.actor}!\n\nDeploying commit \`${pullRequest.head.sha}\` to KIND...\n\n[View deployment progress](${context.payload.repository.html_url}/actions/runs/${context.runId})`
              })
            ]);

  run-ci:
    name: Run CI Tests
    needs: check-preview-request
    uses: ./.github/workflows/ci.yml
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  build-and-deploy:
    name: Build Images & Deploy Preview
    runs-on: self-hosted
    needs: [check-preview-request, run-ci]
    if: needs.run-ci.outputs.build-success == 'true'

    steps:
      - name: Checkout PR code
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.check-preview-request.outputs.pr-ref }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          config-inline: |
            [registry."${{ secrets.NEXUS_PREVIEW }}"]
              http = true
              insecure = true

      - name: Debug buildx config
        run: |
          docker buildx inspect default

      - name: Login to Nexus Registry
        run: |
          echo  "${{ secrets.NEXUS_PASSWORD }}"
          echo  "${{ secrets.NEXUS_PREVIEW }}"
          echo  "${{ secrets.NEXUS_USER }}"
          echo "${{ secrets.NEXUS_PASSWORD }}" | docker login ${{ secrets.NEXUS_PREVIEW }} -u "${{ secrets.NEXUS_USER }}" --password-stdin

      - name: Build and push frontend preview image
        if: needs.run-ci.outputs.frontend-changed == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          secrets: |
            "clerk_publishable_key=${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}"
            "clerk_secret_key=${{ secrets.CLERK_SECRET_KEY }}"
          build-args: |
            NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
            CLERK_SECRET_KEY=${{ secrets.CLERK_SECRET_KEY }}
          tags: |
            ${{ secrets.NEXUS_PREVIEW }}/finance4all-frontend:preview-${{ needs.check-preview-request.outputs.pr-number }}
            ${{ secrets.NEXUS_PREVIEW }}/finance4all-frontend:preview-${{ needs.check-preview-request.outputs.pr-sha }}

      - name: Setup KIND (optimized)
        run: |
          # Vérifier si le cluster existe et est fonctionnel
          if kind get clusters | grep -q "preview-cluster" && kubectl cluster-info --context=kind-preview-cluster >/dev/null 2>&1; then
            echo "✅ KIND cluster already exists and is healthy"
            kubectl config use-context kind-preview-cluster
          else
            echo "🔧 Creating/recreating KIND cluster..."
            # Nettoyer l'ancien cluster s'il existe mais est défaillant
            kind delete cluster --name preview-cluster 2>/dev/null || true
            
            # Configuration optimisée KIND
            cat <<EOF > /tmp/kind-config.yaml
          kind: Cluster
          apiVersion: kind.x-k8s.io/v1alpha4
          name: preview-cluster
          nodes:
          - role: control-plane
            kubeadmConfigPatches:
            - |
              kind: InitConfiguration
              nodeRegistration:
                kubeletExtraArgs:
                  node-labels: "ingress-ready=true"
            extraPortMappings:
            - containerPort: 30080
              hostPort: 30080
              protocol: TCP
          EOF
            
            kind create cluster --config /tmp/kind-config.yaml --wait=120s
            kubectl config use-context kind-preview-cluster
          fi
          
          echo "✅ KIND cluster ready"

      - name: Get server public IP (cached)
        id: server-ip
        run: |
          # Utiliser un cache simple pour éviter les appels répétés
          if [ -f /tmp/public_ip.cache ] && [ $(($(date +%s) - $(stat -c %Y /tmp/public_ip.cache 2>/dev/null || echo 0))) -lt 300 ]; then
            PUBLIC_IP=$(cat /tmp/public_ip.cache)
            echo "Using cached IP: ${PUBLIC_IP}"
          else
            PUBLIC_IP=$(curl -s --max-time 10 ifconfig.me || curl -s --max-time 10 icanhazip.com || echo "localhost")
            echo "${PUBLIC_IP}" > /tmp/public_ip.cache
            echo "Fetched new IP: ${PUBLIC_IP}"
          fi
          echo "ip=${PUBLIC_IP}" >> $GITHUB_OUTPUT

      - name: Load images to KIND and Deploy
        run: |
          # Charger l'image Docker dans KIND (seulement si frontend modifié)
          if [ "${{ needs.run-ci.outputs.frontend-changed }}" == "true" ]; then
            IMAGE_NAME="${{ secrets.NEXUS_PREVIEW }}/finance4all-frontend:preview-${{ needs.check-preview-request.outputs.pr-number }}"
            IMAGE_SHA_NAME="${{ secrets.NEXUS_PREVIEW }}/finance4all-frontend:preview-${{ needs.check-preview-request.outputs.pr-sha }}"
            
            # Vérifier si l'image avec le SHA spécifique existe localement
            if docker image inspect "${IMAGE_SHA_NAME}" >/dev/null 2>&1; then
              echo "✅ Image with correct SHA already exists locally: ${IMAGE_SHA_NAME}"
              # Tag avec le numéro PR pour compatibilité
              docker tag "${IMAGE_SHA_NAME}" "${IMAGE_NAME}" || true
            else
              echo "🔄 Pulling new image with SHA: ${IMAGE_SHA_NAME}"
              # Pull les deux tags (par sécurité)
              docker pull "${IMAGE_NAME}" || echo "Warning: PR-number tag not found"
              docker pull "${IMAGE_SHA_NAME}"
              # Tag local pour uniformité
              docker tag "${IMAGE_SHA_NAME}" "${IMAGE_NAME}" || true
            fi
            
            # Charger dans KIND avec le tag PR-number pour simplicité du déploiement
            kind load docker-image "${IMAGE_NAME}" --name preview-cluster
          else
            echo "Frontend unchanged, skipping image operations"
          fi
          
          # Créer le namespace
          kubectl create namespace preview-pr-${{ needs.check-preview-request.outputs.pr-number }} --dry-run=client -o yaml | kubectl apply -f -
          
          # Déployer l'application
          cat <<EOF | kubectl apply -f -
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: frontend-preview-${{ needs.check-preview-request.outputs.pr-number }}
            namespace: preview-pr-${{ needs.check-preview-request.outputs.pr-number }}
          spec:
            replicas: 1
            selector:
              matchLabels:
                app: frontend-preview-${{ needs.check-preview-request.outputs.pr-number }}
            template:
              metadata:
                labels:
                  app: frontend-preview-${{ needs.check-preview-request.outputs.pr-number }}
              spec:
                containers:
                - name: frontend
                  image: ${{ secrets.NEXUS_PREVIEW }}/finance4all-frontend:preview-${{ needs.check-preview-request.outputs.pr-number }}
                  imagePullPolicy: Never
                  ports:
                  - containerPort: 80
                  env:
                  - name: NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY
                    value: "${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}"
                  - name: CLERK_SECRET_KEY
                    value: "${{ secrets.CLERK_SECRET_KEY }}"
                  - name: PORT
                    value: "80"
          ---
          apiVersion: v1
          kind: Service
          metadata:
            name: frontend-service-${{ needs.check-preview-request.outputs.pr-number }}
            namespace: preview-pr-${{ needs.check-preview-request.outputs.pr-number }}
          spec:
            selector:
              app: frontend-preview-${{ needs.check-preview-request.outputs.pr-number }}
            ports:
            - port: 80
              targetPort: 80
              nodePort: 30080
            type: NodePort
          EOF
          
          # Attendre que le déploiement soit prêt
          kubectl wait --for=condition=ready pod -l app=frontend-preview-${{ needs.check-preview-request.outputs.pr-number }} -n preview-pr-${{ needs.check-preview-request.outputs.pr-number }} --timeout=300s

      - name: Get KIND cluster info
        id: kind-info
        run: |
          # KIND utilise directement l'IP de l'hôte grâce au port mapping
          echo "cluster-ready=true" >> $GITHUB_OUTPUT

      - name: Comment PR with preview URLs
        uses: actions/github-script@v7
        with:
          script: |
            const publicIp = '${{ steps.server-ip.outputs.ip }}';
            const frontendUrl = `http://${publicIp}:30080`;

            github.rest.issues.createComment({
              issue_number: ${{ needs.check-preview-request.outputs.pr-number }},
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `🚀 **Preview déployé avec succès sur KIND !**

              **URLs de preview:**
              - Frontend: ${frontendUrl}

              **Images Docker:**
              - Frontend: \`${{ secrets.NEXUS_PREVIEW }}/finance4all-frontend:preview-${{ needs.check-preview-request.outputs.pr-number }}\`

              **Cluster:** KIND (preview-cluster)
              **Namespace:** \`preview-pr-${{ needs.check-preview-request.outputs.pr-number }}\`

              _Ce preview sera automatiquement supprimé quand la PR sera fermée._`
            });

  notify-failure:
    name: Notify CI Failure
    runs-on: ubuntu-latest
    needs: [check-preview-request, run-ci]
    if: failure() && needs.run-ci.result == 'failure'

    steps:
      - name: Comment PR with failure
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: ${{ needs.check-preview-request.outputs.pr-number }},
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `❌ **Preview déploiement échoué !**

              Les tests CI ont échoué. Veuillez corriger les erreurs avant de demander un nouveau preview avec \`/preview\`.

              Consultez les logs du workflow CI pour plus de détails.`
            });