name: Preview Deploy

on:
  issue_comment:
    types: [created]

jobs:
  # Vérifier si le commentaire est valide et si l'utilisateur a les permissions
  check-comment:
    if: github.event.issue.pull_request && contains(github.event.comment.body, '/preview')
    runs-on: ubuntu-latest
    outputs:
      should-deploy: ${{ steps.check.outputs.should-deploy }}
      pr-number: ${{ steps.pr-info.outputs.pr-number }}
      pr-sha: ${{ steps.pr-info.outputs.pr-sha }}
      pr-ref: ${{ steps.pr-info.outputs.pr-ref }}

    steps:
      - name: Get PR info
        id: pr-info
        if: steps.check.outputs.should-deploy == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });
            
            return {
              prNumber: context.issue.number,
              prSha: pr.data.head.sha,
              prRef: pr.data.head.ref
            };

      - name: React to comment
        if: steps.check.outputs.should-deploy == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            // Ajouter une réaction au commentaire
            await github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              content: 'rocket'
            });
            
            // Ajouter un commentaire de confirmation
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `🚀 **Preview deployment initiated** by @${context.actor}!\n\nDeploying commit \`${steps.pr-info.outputs.pr-sha}\` to Minikube...\n\n[View deployment progress](${context.payload.repository.html_url}/actions/runs/${context.runId})`
            });