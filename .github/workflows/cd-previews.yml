name: Preview

on:
  issue_comment:
    types: [created]

permissions:
  issues: write
  pull-requests: write

jobs:
  check-preview-request:
    if: ${{ github.event.issue.pull_request && contains(github.event.comment.body, '/preview') }}
    name: Check Preview Request
    runs-on: ubuntu-latest
    outputs:
      pr-ref: ${{ steps.pr-details.outputs.ref }}
      pr-sha: ${{ steps.pr-details.outputs.sha }}
      pr-number: ${{ steps.pr-details.outputs.number }}
    
    steps:
      - name: Get PR details
        uses: actions/github-script@v7
        id: pr-details
        with:
          script: |
            const { data: pullRequest } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number
            });
            core.setOutput('ref', pullRequest.head.ref);
            core.setOutput('sha', pullRequest.head.sha);
            core.setOutput('number', context.issue.number);

      - name: React to comment
        uses: actions/github-script@v7
        with:
          script: |
            // Get PR details
            const { data: pullRequest } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number
            });
            
            // Ajouter une réaction au commentaire
            await github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              content: 'rocket'
            });
            
            // Ajouter un commentaire de confirmation
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `🚀 **Preview deployment initiated** by @${context.actor}!\n\nDeploying commit \`${pullRequest.head.sha}\` to Minikube...\n\n[View deployment progress](${context.payload.repository.html_url}/actions/runs/${context.runId})`
            });

  run-ci:
    name: Run CI Tests
    needs: check-preview-request
    uses: ./.github/workflows/ci.yml

  build-and-deploy:
    name: Build Images & Deploy Preview
    runs-on: self-hosted
    needs: [check-preview-request, run-ci]
    if: needs.run-ci.outputs.build-success == 'true'

    steps:
      - name: Checkout PR code
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.check-preview-request.outputs.pr-ref }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          config-inline: |
            [registry."${{ secrets.NEXUS_PREVIEW }}"]
              http = true
              insecure = true

      - name: Debug buildx config
        run: |
          docker buildx inspect default

      - name: Login to Nexus Registry
        run: |
          echo  "${{ secrets.NEXUS_PASSWORD }}"
          echo  "${{ secrets.NEXUS_PREVIEW }}"
          echo  "${{ secrets.NEXUS_USER }}"
          echo "${{ secrets.NEXUS_PASSWORD }}" | docker login ${{ secrets.NEXUS_PREVIEW }} -u "${{ secrets.NEXUS_USER }}" --password-stdin

      - name: Build and push frontend preview image
        if: needs.run-ci.outputs.frontend-changed == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ secrets.NEXUS_PREVIEW }}/finance4all-frontend:preview-${{ needs.check-preview-request.outputs.pr-number }}
            ${{ secrets.NEXUS_PREVIEW }}/finance4all-frontend:preview-${{ needs.check-preview-request.outputs.pr-sha }}

      - name: Start Minikube and configure kubectl
        run: |
          # Vérifier si Minikube est en cours d'exécution
          if ! minikube status | grep -q "host: Running"; then
            echo "Starting Minikube..."
            minikube start --driver=docker --memory=4096 --cpus=2
          else
            echo "Minikube is already running"
          fi
          
          # Configurer kubectl pour utiliser le contexte Minikube
          kubectl config use-context minikube
          
          # Vérifier la connexion
          kubectl cluster-info

      - name: Get server public IP
        id: server-ip
        run: |
          # Récupérer l'IP publique du serveur
          PUBLIC_IP=$(curl -s ifconfig.me)
          echo "ip=${PUBLIC_IP}" >> $GITHUB_OUTPUT
          echo "Public IP: ${PUBLIC_IP}"

      - name: Deploy to Minikube
        run: |
          kubectl create namespace preview-pr-${{ needs.check-preview-request.outputs.pr-number }} --dry-run=client -o yaml | kubectl apply -f -
          
          # Générer un port aléatoire pour éviter les conflits
          FRONTEND_PORT=$((30000 + (${{ needs.check-preview-request.outputs.pr-number }} % 1000)))
          # BACKEND_PORT=$((31000 + (${{ needs.check-preview-request.outputs.pr-number }} % 1000)))
          
          
          cat <<EOF | kubectl apply -f -
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: frontend-preview-${{ needs.check-preview-request.outputs.pr-number }}
            namespace: preview-pr-${{ needs.check-preview-request.outputs.pr-number }}
          spec:
            replicas: 1
            selector:
              matchLabels:
                app: frontend-preview-${{ needs.check-preview-request.outputs.pr-number }}
            template:
              metadata:
                labels:
                  app: frontend-preview-${{ needs.check-preview-request.outputs.pr-number }}
              spec:
                containers:
                - name: frontend
                  image: ${{ secrets.NEXUS_PREVIEW }}/finance4all-frontend:preview-${{ needs.check-preview-request.outputs.pr-number }}
                  ports:
                  - containerPort: 80
          ---
          apiVersion: v1
          kind: Service
          metadata:
            name: frontend-service-${{ needs.check-preview-request.outputs.pr-number }}
            namespace: preview-pr-${{ needs.check-preview-request.outputs.pr-number }}
          spec:
            selector:
              app: frontend-preview-${{ needs.check-preview-request.outputs.pr-number }}
            ports:
            - port: 80
              targetPort: 80
              nodePort: 30080
            type: NodePort
          EOF
          
          echo "FRONTEND_PORT=${FRONTEND_PORT}" >> $GITHUB_ENV

      - name: Get Minikube IP
        id: minikube-ip
        run: |
          echo "ip=$(minikube ip)" >> $GITHUB_OUTPUT

      - name: Comment PR with preview URLs
        uses: actions/github-script@v7
        with:
          script: |
            const publicIp = '${{ steps.server-ip.outputs.ip }}';
            const frontendPort = '${{ env.FRONTEND_PORT }}';
            
            const frontendUrl = `http://${publicIp}:${frontendPort}`;

            github.rest.issues.createComment({
              issue_number: ${{ needs.check-preview-request.outputs.pr-number }},
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `🚀 **Preview déployé avec succès !**

              **URLs de preview:**
              - Frontend: ${frontendUrl}

              **Images Docker:**
              - Frontend: \`${{ secrets.NEXUS_PREVIEW }}/finance4all-frontend:preview-${{ needs.check-preview-request.outputs.pr-number }}\`

              **Namespace Kubernetes:** \`preview-pr-${{ needs.check-preview-request.outputs.pr-number }}\`

              _Ce preview sera automatiquement supprimé quand la PR sera fermée._`
            });

  notify-failure:
    name: Notify CI Failure
    runs-on: ubuntu-latest
    needs: [check-preview-request, run-ci]
    if: failure() && needs.run-ci.result == 'failure'

    steps:
      - name: Comment PR with failure
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: ${{ needs.check-preview-request.outputs.pr-number }},
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `❌ **Preview déploiement échoué !**

              Les tests CI ont échoué. Veuillez corriger les erreurs avant de demander un nouveau preview avec \`/preview\`.

              Consultez les logs du workflow CI pour plus de détails.`
            });
