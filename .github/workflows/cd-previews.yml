name: Preview

on:
  issue_comment:
    types: [ created ]

permissions:
  issues: write
  pull-requests: write
  contents: read
  actions: read

jobs:
  check-preview-request:
    if: ${{ github.event.issue.pull_request && contains(github.event.comment.body, '/preview') }}
    name: Check Preview Request
    runs-on: ubuntu-latest
    outputs:
      pr-ref: ${{ steps.pr-details.outputs.ref }}
      pr-sha: ${{ steps.pr-details.outputs.sha }}
      pr-number: ${{ steps.pr-details.outputs.number }}
    
    steps:
      - name: Get PR details
        uses: actions/github-script@v7
        id: pr-details
        with:
          script: |
            const { data: pullRequest } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number
            });
            core.setOutput('ref', pullRequest.head.ref);
            core.setOutput('sha', pullRequest.head.sha);
            core.setOutput('number', context.issue.number);

      - name: Calculate dynamic ports
        id: ports
        run: |
          # Calculer des ports uniques basés sur le numéro de PR
          # Base: 30000 + (PR_NUMBER * 10)
          # Frontend: base + 0, Backend: base + 1
          PR_NUM=${{ steps.pr_details.outputs.number }}
          BASE_PORT=$((30000 + (${PR_NUM} * 10)))
          FRONTEND_PORT=$((${BASE_PORT} + 0))
          BACKEND_PORT=$((${BASE_PORT} + 1))

          # Vérifier que les ports sont dans la plage valide (30000-32767)
          if [ ${FRONTEND_PORT} -gt 32767 ] || [ ${BACKEND_PORT} -gt 32767 ]; then
            echo "Error: Calculated ports exceed NodePort range"
            exit 1
          fi

          echo "frontend_port=${FRONTEND_PORT}" >> $GITHUB_OUTPUT
          echo "backend_port=${BACKEND_PORT}" >> $GITHUB_OUTPUT
          echo "Calculated ports - Frontend: ${FRONTEND_PORT}, Backend: ${BACKEND_PORT}"

      - name: React to comment (optimized)
        uses: actions/github-script@v7
        with:
          script: |
            const { data: pullRequest } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number
            });
            
            const frontendPort = '${{ steps.ports.outputs.frontend_port }}';
            const backendPort = '${{ steps.ports.outputs.backend_port }}';
            
            // Opérations parallèles
            await Promise.all([
              github.rest.reactions.createForIssueComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: context.payload.comment.id,
                content: 'rocket'
              }),
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: `🚀 **Preview deployment initiated** by @${context.actor}!\n\nDeploying commit \`${pullRequest.head.sha}\` to KIND...\n\n[View deployment progress](${context.payload.repository.html_url}/actions/runs/${context.runId})`
              })
            ]);

  run-ci:
    name: Run CI Tests
    needs: check-preview-request
    uses: ./.github/workflows/ci.yml
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
      CLERK_WEBHOOK_SECRET: ${{ secrets.CLERK_WEBHOOK_SECRET }}
      FRONTEND_URL: ${{ secrets.FRONTEND_URL }}
      GMAIL_USER: ${{ secrets.GMAIL_USER }}
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
      FROM_EMAIL: ${{ secrets.FROM_EMAIL }}
      FROM_NAME: ${{ secrets.FROM_NAME }}

  get-server-ip:
    name: Get Server IP
    runs-on: self-hosted
    needs: [ check-preview-request, run-ci ]
    if: needs.run-ci.outputs.build-success == 'true'
    outputs:
      ip: ${{ steps.server-ip.outputs.ip }}

    steps:
      - name: Get server public IP (cached)
        id: server-ip
        run: |
          # Utiliser un cache simple pour éviter les appels répétés
          if [ -f /tmp/public_ip.cache ] && [ $(($(date +%s) - $(stat -c %Y /tmp/public_ip.cache 2>/dev/null || echo 0))) -lt 300 ]; then
            PUBLIC_IP=$(cat /tmp/public_ip.cache)
            echo "Using cached IP: ${PUBLIC_IP}"
          else
            PUBLIC_IP=$(curl -s --max-time 10 ifconfig.me || curl -s --max-time 10 icanhazip.com || echo "localhost")
            echo "${PUBLIC_IP}" > /tmp/public_ip.cache
            echo "Fetched new IP: ${PUBLIC_IP}"
          fi
          echo "ip=${PUBLIC_IP}" >> $GITHUB_OUTPUT

  build-frontend:
    name: Build Frontend Image
    runs-on: self-hosted
    needs: [ check-preview-request, run-ci, get-server-ip ]
    if: needs.run-ci.outputs.build-success == 'true' && needs.run-ci.outputs.frontend-changed == 'true'

    steps:
      - name: Checkout PR code
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.check-preview-request.outputs.pr-ref }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          config-inline: |
            [registry."${{ secrets.NEXUS_PREVIEW }}"]
              http = true
              insecure = true

      - name: Login to Nexus Registry
        run: |
          echo "${{ secrets.NEXUS_PASSWORD }}" | docker login ${{ secrets.NEXUS_PREVIEW }} -u "${{ secrets.NEXUS_USER }}" --password-stdin

      - name: Build and push frontend preview image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          secrets: |
            "clerk_publishable_key=${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}"
            "clerk_secret_key=${{ secrets.CLERK_SECRET_KEY }}"
          build-args: |
            NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
            CLERK_SECRET_KEY=${{ secrets.CLERK_SECRET_KEY }}
            NEXT_PUBLIC_API_URL=http://${{ needs.get-server-ip.outputs.ip }}:${{ needs.check-preview-request.outputs.backend_port }}
          tags: |
            ${{ secrets.NEXUS_PREVIEW }}/finance4all-frontend:preview-${{ needs.check-preview-request.outputs.pr-number }}
            ${{ secrets.NEXUS_PREVIEW }}/finance4all-frontend:preview-${{ needs.check-preview-request.outputs.pr-sha }}

  build-backend:
    name: Build Backend Image
    runs-on: self-hosted
    needs: [ check-preview-request, run-ci, get-server-ip ]
    if: needs.run-ci.outputs.build-success == 'true' && needs.run-ci.outputs.backend-changed == 'true'

    steps:
      - name: Checkout PR code
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.check-preview-request.outputs.pr-ref }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          config-inline: |
            [registry."${{ secrets.NEXUS_PREVIEW }}"]
              http = true
              insecure = true

      - name: Login to Nexus Registry
        run: |
          echo "${{ secrets.NEXUS_PASSWORD }}" | docker login ${{ secrets.NEXUS_PREVIEW }} -u "${{ secrets.NEXUS_USER }}" --password-stdin

      - name: Build and push backend preview image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          secrets: |
            "clerk_publishable_key=${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}"
            "clerk_secret_key=${{ secrets.CLERK_SECRET_KEY }}"
            "clerk_webhook_secret=${{ secrets.CLERK_WEBHOOK_SECRET }}"
            "frontend_url=${{ secrets.FRONTEND_URL }}"
            "gmail_user=${{ secrets.GMAIL_USER }}"
            "gmail_app_password=${{ secrets.GMAIL_APP_PASSWORD }}"
            "from_email=${{ secrets.FROM_EMAIL }}"
            "from_name=${{ secrets.FROM_NAME }}"
          build-args: |
            CLERK_PUBLISHABLE_KEY=${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
            CLERK_SECRET_KEY=${{ secrets.CLERK_SECRET_KEY }}
            CLERK_WEBHOOK_SECRET=${{ secrets.CLERK_WEBHOOK_SECRET }}
            FRONTEND_URL=${{ secrets.FRONTEND_URL }}
            GMAIL_USER=${{ secrets.GMAIL_USER }}
            GMAIL_APP_PASSWORD=${{ secrets.GMAIL_APP_PASSWORD }}
            FROM_EMAIL=${{ secrets.FROM_EMAIL }}
            FROM_NAME=${{ secrets.FROM_NAME }}
          tags: |
            ${{ secrets.NEXUS_PREVIEW }}/finance4all-backend:preview-${{ needs.check-preview-request.outputs.pr-number }}
            ${{ secrets.NEXUS_PREVIEW }}/finance4all-backend:preview-${{ needs.check-preview-request.outputs.pr-sha }}

  deploy-preview:
    name: Deploy Preview
    runs-on: self-hosted
    needs: [ check-preview-request, run-ci, get-server-ip, build-frontend, build-backend ]
    if: |
      always() &&
      needs.run-ci.outputs.build-success == 'true' &&
      (needs.build-frontend.result == 'success' || needs.build-frontend.result == 'skipped') &&
      (needs.build-backend.result == 'success' || needs.build-backend.result == 'skipped')

    steps:
      - name: Checkout PR code
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.check-preview-request.outputs.pr-ref }}

      - name: Login to Nexus Registry
        run: |
          echo "${{ secrets.NEXUS_PASSWORD }}" | docker login ${{ secrets.NEXUS_PREVIEW }} -u "${{ secrets.NEXUS_USER }}" --password-stdin

      - name: Setup KIND with dynamic ports
        run: |
          CLUSTER_NAME="preview-cluster"
          FRONTEND_PORT="${{ needs.check-preview-request.outputs.frontend_port }}"
          BACKEND_PORT="${{ needs.check-preview-request.outputs.backend_port }}"

          # Vérifier si le cluster existe et est fonctionnel
          if kind get clusters | grep -q "${CLUSTER_NAME}" && kubectl cluster-info --context=kind-${CLUSTER_NAME} >/dev/null 2>&1; then
            echo "✅ KIND cluster already exists and is healthy"
            kubectl config use-context kind-${CLUSTER_NAME}

            # Vérifier si les ports sont déjà mappés
            if docker port ${CLUSTER_NAME}-control-plane | grep -q "${FRONTEND_PORT}\|${BACKEND_PORT}"; then
              echo "Ports already mapped for this cluster"
            else
              echo "🔧 Cluster exists but ports need to be updated..."
              # Pour des nouveaux ports, nous devons recréer le cluster
              kind delete cluster --name ${CLUSTER_NAME} 2>/dev/null || true
            fi
          fi

          # Créer ou recréer le cluster si nécessaire
          if ! kind get clusters | grep -q "${CLUSTER_NAME}" || ! kubectl cluster-info --context=kind-${CLUSTER_NAME} >/dev/null 2>&1; then
            echo "🔧 Creating KIND cluster with dynamic ports..."

            # Configuration dynamique avec les ports calculés
            cat <<EOF > /tmp/kind-config.yaml
          kind: Cluster
          apiVersion: kind.x-k8s.io/v1alpha4
          name: ${CLUSTER_NAME}
          nodes:
          - role: control-plane
            kubeadmConfigPatches:
            - |
              kind: InitConfiguration
              nodeRegistration:
                kubeletExtraArgs:
                  node-labels: "ingress-ready=true"
            extraPortMappings:
            - containerPort: ${FRONTEND_PORT}
              hostPort: ${FRONTEND_PORT}
              protocol: TCP
            - containerPort: ${BACKEND_PORT}
              hostPort: ${BACKEND_PORT}
              protocol: TCP
          EOF

            kind create cluster --config /tmp/kind-config.yaml --wait=120s
            kubectl config use-context kind-${CLUSTER_NAME}
          fi

          echo "✅ KIND cluster ready with ports: Frontend=${FRONTEND_PORT}, Backend=${BACKEND_PORT}"

      - name: Load images to KIND and Deploy
        run: |
          FRONTEND_PORT="${{ needs.check-preview-request.outputs.frontend_port }}"
          BACKEND_PORT="${{ needs.check-preview-request.outputs.backend_port }}"
          PR_NUMBER="${{ needs.check-preview-request.outputs.pr-number }}"

          # Charger l'image frontend si modifiée
          if [ "${{ needs.run-ci.outputs.frontend-changed }}" == "true" ]; then
            IMAGE_NAME="${{ secrets.NEXUS_PREVIEW }}/finance4all-frontend:preview-${PR_NUMBER}"
            IMAGE_SHA_NAME="${{ secrets.NEXUS_PREVIEW }}/finance4all-frontend:preview-${{ needs.check-preview-request.outputs.pr-sha }}"

            if docker image inspect "${IMAGE_SHA_NAME}" >/dev/null 2>&1; then
              echo "✅ Frontend image with correct SHA already exists locally: ${IMAGE_SHA_NAME}"
              docker tag "${IMAGE_SHA_NAME}" "${IMAGE_NAME}" || true
            else
              echo "🔄 Pulling new frontend image with SHA: ${IMAGE_SHA_NAME}"
              docker pull "${IMAGE_NAME}" || echo "Warning: PR-number tag not found"
              docker pull "${IMAGE_SHA_NAME}"
              docker tag "${IMAGE_SHA_NAME}" "${IMAGE_NAME}" || true
            fi

            kind load docker-image "${IMAGE_NAME}" --name preview-cluster
          else
            echo "Frontend unchanged, skipping image operations"
          fi

          # Charger l'image backend si modifiée
          if [ "${{ needs.run-ci.outputs.backend-changed }}" == "true" ]; then
            BACKEND_IMAGE_NAME="${{ secrets.NEXUS_PREVIEW }}/finance4all-backend:preview-${PR_NUMBER}"
            BACKEND_IMAGE_SHA_NAME="${{ secrets.NEXUS_PREVIEW }}/finance4all-backend:preview-${{ needs.check-preview-request.outputs.pr-sha }}"

            if docker image inspect "${BACKEND_IMAGE_SHA_NAME}" >/dev/null 2>&1; then
              echo "✅ Backend image with correct SHA already exists locally: ${BACKEND_IMAGE_SHA_NAME}"
              docker tag "${BACKEND_IMAGE_SHA_NAME}" "${BACKEND_IMAGE_NAME}" || true
            else
              echo "🔄 Pulling new backend image with SHA: ${BACKEND_IMAGE_SHA_NAME}"
              docker pull "${BACKEND_IMAGE_NAME}" || echo "Warning: Backend PR-number tag not found"
              docker pull "${BACKEND_IMAGE_SHA_NAME}"
              docker tag "${BACKEND_IMAGE_SHA_NAME}" "${BACKEND_IMAGE_NAME}" || true
            fi

            kind load docker-image "${BACKEND_IMAGE_NAME}" --name preview-cluster
          else
            echo "Backend unchanged, skipping backend image operations"
          fi

          # Créer le namespace
          kubectl create namespace preview-pr-${PR_NUMBER} --dry-run=client -o yaml | kubectl apply -f -

          # Déployer avec les ports dynamiques
          cat <<EOF | kubectl apply -f -
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: postgres-preview-${PR_NUMBER}
            namespace: preview-pr-${PR_NUMBER}
          spec:
            replicas: 1
            selector:
              matchLabels:
                app: postgres-preview-${PR_NUMBER}
            template:
              metadata:
                labels:
                  app: postgres-preview-${PR_NUMBER}
              spec:
                containers:
                - name: postgres
                  image: postgres:15-alpine
                  ports:
                  - containerPort: 5432
                  env:
                  - name: POSTGRES_DB
                    value: "finance4all_preview"
                  - name: POSTGRES_USER
                    value: "finance4all"
                  - name: POSTGRES_PASSWORD
                    value: "finance4All_preview"
                  - name: PGDATA
                    value: "/var/lib/postgresql/data/pgdata"
                  volumeMounts:
                  - name: postgres-storage
                    mountPath: /var/lib/postgresql/data
                volumes:
                - name: postgres-storage
                  emptyDir: {}
          ---
          apiVersion: v1
          kind: Service
          metadata:
            name: postgres-service-${PR_NUMBER}
            namespace: preview-pr-${PR_NUMBER}
          spec:
            selector:
              app: postgres-preview-${PR_NUMBER}
            ports:
            - port: 5432
              targetPort: 5432
          ---
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: backend-preview-${PR_NUMBER}
            namespace: preview-pr-${PR_NUMBER}
          spec:
            replicas: 1
            selector:
              matchLabels:
                app: backend-preview-${PR_NUMBER}
            template:
              metadata:
                labels:
                  app: backend-preview-${PR_NUMBER}
              spec:
                containers:
                - name: backend
                  image: ${{ secrets.NEXUS_PREVIEW }}/finance4all-backend:preview-${PR_NUMBER}
                  imagePullPolicy: Never
                  ports:
                  - containerPort: 5000
                  env:
                  - name: NODE_ENV
                    value: "production"
                  - name: PORT
                    value: "5000"
                  - name: API_VERSION
                    value: "v1"
                  - name: DATABASE_URL
                    value: "postgresql://finance4all:finance4All_preview@postgres-service-${PR_NUMBER}:5432/finance4all_preview?schema=public"
                  - name: CLERK_PUBLISHABLE_KEY
                    value: "${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}"
                  - name: CLERK_SECRET_KEY
                    value: "${{ secrets.CLERK_SECRET_KEY }}"
                  - name: CLERK_WEBHOOK_SECRET
                    value: "${{ secrets.CLERK_WEBHOOK_SECRET }}"
                  - name: FRONTEND_URL
                    value: "http://${{ needs.get-server-ip.outputs.ip }}:${FRONTEND_PORT}"
                  - name: GMAIL_USER
                    value: "${{ secrets.GMAIL_USER }}"
                  - name: GMAIL_APP_PASSWORD
                    value: "${{ secrets.GMAIL_APP_PASSWORD }}"
                  - name: FROM_EMAIL
                    value: "${{ secrets.FROM_EMAIL }}"
                  - name: FROM_NAME
                    value: "${{ secrets.FROM_NAME }}"
                  - name: CORS_ORIGIN
                    value: "http://${{ needs.get-server-ip.outputs.ip }}:${FRONTEND_PORT}"
          ---
          apiVersion: v1
          kind: Service
          metadata:
            name: backend-service-${PR_NUMBER}
            namespace: preview-pr-${PR_NUMBER}
          spec:
            selector:
              app: backend-preview-${PR_NUMBER}
            ports:
            - port: 5000
              targetPort: 5000
              nodePort: ${BACKEND_PORT}
            type: NodePort
          ---
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: frontend-preview-${PR_NUMBER}
            namespace: preview-pr-${PR_NUMBER}
          spec:
            replicas: 1
            selector:
              matchLabels:
                app: frontend-preview-${PR_NUMBER}
            template:
              metadata:
                labels:
                  app: frontend-preview-${PR_NUMBER}
              spec:
                containers:
                - name: frontend
                  image: ${{ secrets.NEXUS_PREVIEW }}/finance4all-frontend:preview-${PR_NUMBER}
                  imagePullPolicy: Never
                  ports:
                  - containerPort: 80
                  env:
                  - name: NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY
                    value: "${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}"
                  - name: CLERK_SECRET_KEY
                    value: "${{ secrets.CLERK_SECRET_KEY }}"
                  - name: PORT
                    value: "80"
                  - name: NEXT_PUBLIC_API_URL
                    value: "http://${{ needs.get-server-ip.outputs.ip }}:${BACKEND_PORT}"
          ---
          apiVersion: v1
          kind: Service
          metadata:
            name: frontend-service-${PR_NUMBER}
            namespace: preview-pr-${PR_NUMBER}
          spec:
            selector:
              app: frontend-preview-${PR_NUMBER}
            ports:
            - port: 80
              targetPort: 80
              nodePort: ${FRONTEND_PORT}
            type: NodePort
          EOF

          # Attendre que tous les déploiements soient prêts
          echo "⏳ Waiting for PostgreSQL to be ready..."
          kubectl wait --for=condition=ready pod -l app=postgres-preview-${PR_NUMBER} -n preview-pr-${PR_NUMBER} --timeout=300s

          echo "⏳ Waiting for Backend to be ready..."
          kubectl wait --for=condition=ready pod -l app=backend-preview-${PR_NUMBER} -n preview-pr-${PR_NUMBER} --timeout=300s

          echo "⏳ Waiting for Frontend to be ready..."
          kubectl wait --for=condition=ready pod -l app=frontend-preview-${PR_NUMBER} -n preview-pr-${PR_NUMBER} --timeout=300s

      - name: Comment PR with preview URLs
        uses: actions/github-script@v7
        with:
          script: |
            const publicIp = '${{ needs.get-server-ip.outputs.ip }}';
            const frontendPort = '${{ needs.check-preview-request.outputs.frontend_port }}';
            const backendPort = '${{ needs.check-preview-request.outputs.backend_port }}';
            const frontendUrl = `http://${publicIp}:${frontendPort}`;
            const backendUrl = `http://${publicIp}:${backendPort}`;

            github.rest.issues.createComment({
              issue_number: ${{ needs.check-preview-request.outputs.pr-number }},
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `🚀 **Preview déployé avec succès sur KIND !**

              **URLs de preview (PR #${{ needs.check-preview-request.outputs.pr-number }}):**
              - Frontend: ${frontendUrl}
              - Backend API: ${backendUrl}
              - API Health: ${backendUrl}/health

              **Ports assignés:**
              - Frontend: ${frontendPort}
              - Backend: ${backendPort}

              **Images Docker:**
              - Frontend: \`${{ secrets.NEXUS_PREVIEW }}/finance4all-frontend:preview-${{ needs.check-preview-request.outputs.pr-number }}\`
              - Backend: \`${{ secrets.NEXUS_PREVIEW }}/finance4all-backend:preview-${{ needs.check-preview-request.outputs.pr-number }}\`

              **Services déployés:**
              - PostgreSQL (base de données interne)
              - Backend API (Node.js + Prisma)
              - Frontend (Next.js)

              **Cluster:** KIND (preview-cluster)
              **Namespace:** \`preview-pr-${{ needs.check-preview-request.outputs.pr-number }}\`

              _Ce preview sera automatiquement supprimé quand la PR sera fermée._`
            });

  notify-failure:
    name: Notify CI Failure
    runs-on: ubuntu-latest
    needs: [ check-preview-request, run-ci ]
    if: failure() && needs.run-ci.result == 'failure'

    steps:
      - name: Comment PR with failure
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: ${{ needs.check-preview-request.outputs.pr-number }},
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `❌ **Preview déploiement échoué !**

              Les tests CI ont échoué. Veuillez corriger les erreurs avant de demander un nouveau preview avec \`/preview\`.

              Consultez les logs du workflow CI pour plus de détails.`
            });