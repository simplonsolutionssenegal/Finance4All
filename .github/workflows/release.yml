name: Release

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to deploy to"
        required: true
        default: "staging"
        type: choice
        options:
          - staging
          - production

env:
  FRONT_IMAGE: ${{ secrets.DOCKER_USERNAME }}/finance4all-frontend
  BACK_IMAGE: ${{ secrets.DOCKER_USERNAME }}/finance4all-backend

jobs:
  test-and-build:
    name: 🧪 Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install root dependencies
        run: npm ci

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: |
          npm ci
          npm rebuild lightningcss --force

      - name: Install backend dependencies
        working-directory: ./backend
        run: npm ci

      - name: Run frontend linting
        working-directory: ./frontend
        run: npm run lint

      - name: Run frontend type checking
        working-directory: ./frontend
        run: npm run type-check || npm run tsc --noEmit

      - name: Run frontend tests
        working-directory: ./frontend
        run: npm test

      - name: Run backend linting
        working-directory: ./backend
        run: npm run lint

      - name: Run backend type checking
        working-directory: ./backend
        run: npm run type-check || npm run tsc --noEmit

      - name: Build frontend application
        working-directory: ./frontend
        run: npm run build

      - name: Build backend application
        working-directory: ./backend
        run: npm run build

  docker-build:
    name: 🐳 Build Docker Images
    runs-on: ubuntu-latest
    needs: test-and-build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.FRONT_IMAGE }}:${{ inputs.environment }}
            ${{ env.FRONT_IMAGE }}:${{ inputs.environment }}-${{ github.sha }}

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.BACK_IMAGE }}:${{ inputs.environment }}
            ${{ env.BACK_IMAGE }}:${{ inputs.environment }}-${{ github.sha }}
