name: Release

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

jobs:
  test-and-build:
    name: 🧪 Test & Build (Frontend & Backend)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
      uses: actions/checkout@v4

      - name: Set up Node.js
      uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install root dependencies
        run: npm ci

      # -----------------------------------------------------
      # FRONTEND
      # -----------------------------------------------------
      - name: Install frontend dependencies
        working-directory: ./frontend
        run: |
          rm -rf node_modules
          npm ci
          npm rebuild lightningcss --force

      - name: Lint frontend
        working-directory: ./frontend
        run: npm run lint

      - name: Type-check frontend
        working-directory: ./frontend
        run: npm run type-check || npm run tsc --noEmit

      - name: Test frontend
        working-directory: ./frontend
        run: npm test

      - name: Build frontend
        working-directory: ./frontend
        run: npm run build

      # -----------------------------------------------------
      # BACKEND
      # -----------------------------------------------------
      - name: Install backend dependencies
        working-directory: ./backend
        run: npm ci

      - name: Lint backend
        working-directory: ./backend
        run: npm run lint

      - name: Type-check backend
        working-directory: ./backend
        run: npm run type-check || npm run tsc --noEmit

      - name: Test backend
        working-directory: ./backend
        run: npm test

      - name: Build backend
        working-directory: ./backend
        run: npm run build

  docker-build:
    name: 🐳 Build & Push Docker Images (Nexus)
    runs-on: ubuntu-latest
    needs: test-and-build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Nexus Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.NEXUS_URL }}
          username: ${{ secrets.NEXUS_USERNAME }}
          password: ${{ secrets.NEXUS_PASSWORD }}

      # -----------------------------------------------------
      # FRONTEND IMAGE
      # -----------------------------------------------------
      - name: Build & Push Frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ secrets.NEXUS_URL }}/finance4all/frontend:${{ github.event.inputs.environment }}
            ${{ secrets.NEXUS_URL }}/finance4all/frontend:${{ github.sha }}
            ${{ secrets.NEXUS_URL }}/finance4all/frontend:latest

      # -----------------------------------------------------
      # BACKEND IMAGE
      # -----------------------------------------------------
      - name: Build & Push Backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ secrets.NEXUS_URL }}/finance4all/backend:${{ github.event.inputs.environment }}
            ${{ secrets.NEXUS_URL }}/finance4all/backend:${{ github.sha }}
            ${{ secrets.NEXUS_URL }}/finance4all/backend:latest
