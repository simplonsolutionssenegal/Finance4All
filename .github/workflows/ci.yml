name: CI-Build

on:
  push:
    branches-ignore: ['main']
  workflow_call:
    outputs:
      frontend-changed:
        description: "Frontend changed"
        value: ${{ jobs.detect-changes.outputs.frontend-changed }}
      backend-changed:
        description: "Backend changed"  
        value: ${{ jobs.detect-changes.outputs.backend-changed }}
      build-success:
        description: "Build successful"
        value: ${{ jobs.build-frontend.result == 'success' }}

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      frontend-changed: ${{ steps.changes.outputs.frontend }}
      backend-changed: ${{ steps.changes.outputs.backend }}
      any-changed: ${{ steps.changes.outputs.frontend == 'true' || steps.changes.outputs.backend == 'true' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Detect changes
        uses: dorny/paths-filter@v2
        id: changes
        with:
          filters: |
            frontend:
              - 'frontend/**'
              - 'frontend/package.json'
              - 'frontend/package-lock.json'
            backend:
              - 'backend/**'

  test-frontend:
    name: 🧪 Run Frontend Unit Tests
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.frontend-changed == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: |
          npm ci
          npm rebuild

      - name: Run frontend linting
        working-directory: ./frontend
        run: npm run lint

      - name: Run frontend type checking
        working-directory: ./frontend
        run: npm run type-check || npm run tsc --noEmit

      - name: Run frontend tests
        working-directory: ./frontend
        run: npm test

      - name: Generate frontend test coverage
        working-directory: ./frontend
        run: npm run test:coverage || npm test -- --coverage || echo "No coverage configured"

