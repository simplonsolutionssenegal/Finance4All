name: CI-Build

on:
  push:
  pull_request:

  workflow_call:
    secrets:
      SONAR_TOKEN:
        description: 'SonarQube token for analysis'
        required: false
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY:
        description: 'Clerk publishable key'
        required: false
      NEXT_PUBLIC_API_URL:
        description: 'Endpoint Backend'
        required: false
      CLERK_SECRET_KEY:
        description: 'Clerk secret key'
        required: false
      CLERK_WEBHOOK_SECRET:
        description: 'Clerk webhook secret key'
        required: false
      FRONTEND_URL:
        description: 'Frontend endpoint'
        required: false
      GMAIL_USER:
        description: 'GMAIL APP user'
        required: false
      GMAIL_APP_PASSWORD:
        description: 'GMAIL APP password'
        required: false
      FROM_EMAIL:
        description: 'GMAIL FROM EMAIL value'
        required: false
      FROM_NAME:
        description: 'GMAIL FROM NAME value'
        required: false
    outputs:
      frontend-changed:
        description: "Frontend changed"
        value: ${{ jobs.detect-changes.outputs.frontend-changed }}
      backend-changed:
        description: "Backend changed"
        value: ${{ jobs.detect-changes.outputs.backend-changed }}
      build-success:
        description: "Build successful"
        value: ${{ jobs.test-and-build-frontend.result == 'success' && jobs.test-and-build-backend.result == 'success' }}
      sonar-success:
        description: "SonarQube analysis successful"
        value: ${{ jobs.sonarqube-frontend.result == 'success' && jobs.sonarqube-backend.result == 'success' }}

permissions:
  contents: read
  pull-requests: read
  actions: read

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      frontend-changed: ${{ steps.changes.outputs.frontend }}
      backend-changed: ${{ steps.changes.outputs.backend }}
      any-changed: ${{ steps.changes.outputs.frontend == 'true' || steps.changes.outputs.backend == 'true' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Detect changes
        uses: dorny/paths-filter@v2
        id: changes
        with:
          filters: |
            frontend:
              - 'frontend/**'
              - 'frontend/package.json'
            backend:
              - 'backend/**'
              - 'backend/package.json'



  test-and-build-frontend:
    name: 🧪 Test & Build Frontend
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.frontend-changed == 'true'
    env:
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
      NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: |
            frontend/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('frontend/package-lock.json') }}-${{ hashFiles('frontend/**/*.js', 'frontend/**/*.jsx', 'frontend/**/*.ts', 'frontend/**/*.tsx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('frontend/package-lock.json') }}-

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run frontend linting
        working-directory: ./frontend
        run: npm run lint

      - name: Run frontend type checking
        working-directory: ./frontend
        run: npm run type-check || npm run tsc --noEmit

      - name: Run frontend tests with coverage
        working-directory: ./frontend
        run: npm run test:coverage -- --maxWorkers=50% --passWithNoTests || npm test -- --coverage --maxWorkers=50% --passWithNoTests || echo "No coverage configured"

      - name: Upload coverage for SonarQube
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: frontend-coverage
          path: frontend/coverage
          retention-days: 1

      - name: Build frontend application
        working-directory: ./frontend
        run: npm run build

  test-and-build-backend:
    name: 🧪 Test & Build Backend
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.backend-changed == 'true'
    env:
      CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
      CLERK_WEBHOOK_SECRET: ${{ secrets.CLERK_WEBHOOK_SECRET }}
      FRONTEND_URL: ${{ secrets.FRONTEND_URL }}
      GMAIL_USER: ${{ secrets.GMAIL_USER }}
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
      FROM_EMAIL: ${{ secrets.FROM_EMAIL }}
      FROM_NAME: ${{ secrets.FROM_NAME }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'backend/package-lock.json'

      - name: Install backend dependencies
        working-directory: ./backend
        run: npm ci

      - name: Run backend linting
        working-directory: ./backend
        run: npm run lint

      - name: Run backend type checking
        working-directory: ./backend
        run: npm run type-check || npm run tsc --noEmit

      - name: Run backend tests with coverage
        working-directory: ./backend
        run: npm run test:coverage -- --maxWorkers=50% --passWithNoTests || npm test -- --coverage --maxWorkers=50% --passWithNoTests || echo "No coverage configured"

      - name: Upload coverage for SonarQube
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: backend-coverage
          path: backend/coverage
          retention-days: 1

      - name: Build backend application
        working-directory: ./backend
        run: npm run build

  sonarqube-frontend:
    name: 📊 SonarQube Frontend
    runs-on: ubuntu-latest
    needs: [ detect-changes, test-and-build-frontend ]
    if: always() && needs.detect-changes.outputs.frontend-changed == 'true'
    env:
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download coverage artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage

      - name: Run SonarQube Scan (Frontend)
        uses: SonarSource/sonarqube-scan-action@master
        with:
          projectBaseDir: frontend
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: SonarQube Quality Gate (Frontend)
        uses: sonarsource/sonarqube-quality-gate-action@master
        with:
          scanMetadataReportFile: frontend/.scannerwork/report-task.txt
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  sonarqube-backend:
    name: 📊 SonarQube Backend
    runs-on: ubuntu-latest
    needs: [ detect-changes, test-and-build-backend ]
    if: always() && needs.detect-changes.outputs.backend-changed == 'true'
    env:
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
      CLERK_WEBHOOK_SECRET: ${{ secrets.CLERK_WEBHOOK_SECRET }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download coverage artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage

      - name: Run SonarQube Scan (Backend)
        uses: SonarSource/sonarqube-scan-action@master
        with:
          projectBaseDir: backend
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: SonarQube Quality Gate (Backend)
        uses: sonarsource/sonarqube-quality-gate-action@master
        with:
          scanMetadataReportFile: backend/.scannerwork/report-task.txt
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}