name: CI-Build

on:
  push:
    branches: ['main']
  pull_request:

  workflow_call:
    outputs:
      frontend-changed:
        description: "Frontend changed"
        value: ${{ jobs.detect-changes.outputs.frontend-changed }}
      backend-changed:
        description: "Backend changed"  
        value: ${{ jobs.detect-changes.outputs.backend-changed }}
      build-success:
        description: "Build successful"
        value: ${{ jobs.build-frontend.result == 'success' && jobs.build-backend.result == 'success' }}

permissions:
  contents: read
  pull-requests: read
  actions: read

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      frontend-changed: ${{ steps.changes.outputs.frontend }}
      backend-changed: ${{ steps.changes.outputs.backend }}
      any-changed: ${{ steps.changes.outputs.frontend == 'true' || steps.changes.outputs.backend == 'true' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Detect changes
        uses: dorny/paths-filter@v2
        id: changes
        with:
          filters: |
            frontend:
              - 'frontend/**'
              - 'frontend/package.json'
              - 'frontend/package-lock.json'
            backend:
              - 'backend/**'
              - 'backend/package.json'
              - 'backend/package-lock.json'

  test-frontend:
    name: 🧪 Run Frontend Unit Tests
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.frontend-changed == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: |
          npm ci
          npm rebuild

      - name: Run frontend linting
        working-directory: ./frontend
        run: npm run lint

      - name: Run frontend type checking
        working-directory: ./frontend
        run: npm run type-check || npm run tsc --noEmit

      - name: Run frontend tests
        working-directory: ./frontend
        run: npm test

      - name: Generate frontend test coverage
        working-directory: ./frontend
        run: npm run test:coverage || npm test -- --coverage || echo "No coverage configured"

  test-backend:
    name: 🧪 Run Backend Unit Tests
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.backend-changed == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache-dependency-path: backend/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install backend dependencies
        working-directory: ./backend
        run: npm ci

      - name: Run backend linting
        working-directory: ./backend
        run: npm run lint

      - name: Run backend type checking
        working-directory: ./backend
        run: npm run type-check || npm run tsc --noEmit

      - name: Run backend tests
        working-directory: ./backend
        run: npm test

      - name: Generate backend test coverage
        working-directory: ./backend
        run: npm run test:coverage || npm test -- --coverage || echo "No coverage configured"

  sonarqube:
    name: 📊 SonarQube Analysis
    runs-on: ubuntu-latest
    needs: [detect-changes, test-frontend, test-backend]
    if: always() && needs.detect-changes.outputs.any-changed == 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install frontend dependencies for coverage
        if: needs.detect-changes.outputs.frontend-changed == 'true'
        working-directory: ./frontend
        run: npm ci

      - name: Install backend dependencies for coverage
        if: needs.detect-changes.outputs.backend-changed == 'true'
        working-directory: ./backend
        run: npm ci
          
      - name: Generate frontend coverage report
        if: needs.detect-changes.outputs.frontend-changed == 'true'
        working-directory: ./frontend
        run: npm run test:coverage || npm test -- --coverage || echo "No frontend coverage"

      - name: Generate backend coverage report
        if: needs.detect-changes.outputs.backend-changed == 'true'
        working-directory: ./backend
        run: npm run test:coverage || npm test -- --coverage || echo "No backend coverage"

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@master
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: SonarQube Quality Gate Check
        id: sonarqube-quality-gate-check
        uses: sonarsource/sonarqube-quality-gate-action@master
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}


  build-frontend:
    name: 🛠 Build frontend
    runs-on: ubuntu-latest
    needs: [detect-changes, test-frontend, sonarqube]
    if: needs.detect-changes.outputs.frontend-changed == 'true' && needs.test-frontend.result == 'success' && needs.sonarqube.result == 'success'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: |
          rm -rf node_modules
          npm ci
          npm rebuild lightningcss --force

      - name: Build frontend application
        working-directory: ./frontend
        run: npm run build

  build-backend:
    name: 🛠 Build backend
    runs-on: ubuntu-latest
    needs: [ detect-changes, test-backend, sonarqube ]
    if: needs.detect-changes.outputs.backend-changed == 'true' && needs.test-backend.result == 'success' && needs.sonarqube.result == 'success'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: ./backend
        run: |
          rm -rf node_modules
          npm ci

      - name: Build backend application
        working-directory: ./backend
        run: npm run build
