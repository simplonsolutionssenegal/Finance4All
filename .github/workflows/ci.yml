name: CI-Build

on:
  push:
    branches: [ 'main' ]
  pull_request:

  workflow_call:
    secrets:
      SONAR_TOKEN:
        description: 'SonarQube token for analysis'
        required: false
      SONAR_HOST_URL:
        description: 'SonarQube server URL'
        required: false
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY:
        description: 'Clerk publishable key'
        required: false
      NEXT_PUBLIC_API_URL:
        description: 'Endpoint Backend'
        required: false
      CLERK_SECRET_KEY:
        description: 'Clerk secret key'
        required: false
      CLERK_WEBHOOK_SECRET:
        description: 'Clerk webhook secret key'
        required: false
      FRONTEND_URL:
        description: 'Frontend endpoint'
        required: false
      GMAIL_USER:
        description: 'GMAIL APP user'
        required: false
      GMAIL_APP_PASSWORD:
        description: 'GMAIL APP password'
        required: false
      FROM_EMAIL:
        description: 'GMAIL FROM EMAIL value'
        required: false
      FROM_NAME:
        description: 'GMAIL FROM NAME value'
        required: false
    outputs:
      frontend-changed:
        description: "Frontend changed"
        value: ${{ jobs.detect-changes.outputs.frontend-changed }}
      backend-changed:
        description: "Backend changed"
        value: ${{ jobs.detect-changes.outputs.backend-changed }}
      build-success:
        description: "Build successful"
        value: ${{ jobs.build-frontend.result == 'success' && jobs.build-backend.result == 'success' }}
      sonar-success:
        description: "SonarQube analysis successful"
        value: ${{ jobs.sonarqube-frontend.result == 'success' && jobs.sonarqube-backend.result == 'success' }}

permissions:
  contents: read
  pull-requests: read
  actions: read

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      frontend-changed: ${{ steps.changes.outputs.frontend }}
      backend-changed: ${{ steps.changes.outputs.backend }}
      any-changed: ${{ steps.changes.outputs.frontend == 'true' || steps.changes.outputs.backend == 'true' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Detect changes
        uses: dorny/paths-filter@v2
        id: changes
        with:
          filters: |
            frontend:
              - 'frontend/**'
              - 'frontend/package.json'
            backend:
              - 'backend/**'
              - 'backend/package.json'


  test-frontend:
    name: 🧪 Run Frontend Unit Tests
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.frontend-changed == 'true'
    env:
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
      NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Cache frontend node_modules
        uses: actions/cache@v4
        with:
          path: frontend/node_modules
          key: ${{ runner.os }}-frontend-${{ hashFiles('frontend/package.json') }}
          restore-keys: |
            ${{ runner.os }}-frontend-

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run frontend linting
        working-directory: ./frontend
        run: npm run lint

      - name: Run frontend type checking
        working-directory: ./frontend
        run: npm run type-check || npm run tsc --noEmit

      - name: Run frontend tests (parallel)
        working-directory: ./frontend
        run: npm test -- --maxWorkers=50% --passWithNoTests

      - name: Generate frontend test coverage (parallel)
        working-directory: ./frontend
        run: npm run test:coverage -- --maxWorkers=50% || npm test -- --coverage --maxWorkers=50% || echo "No coverage configured"

  test-backend:
    name: 🧪 Run Backend Unit Tests
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.backend-changed == 'true'
    env:
      CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
      CLERK_WEBHOOK_SECRET: ${{ secrets.CLERK_WEBHOOK_SECRET }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Cache backend node_modules
        uses: actions/cache@v4
        with:
          path: backend/node_modules
          key: ${{ runner.os }}-backend-${{ hashFiles('backend/package.json') }}
          restore-keys: |
            ${{ runner.os }}-backend-

      - name: Install backend dependencies
        working-directory: ./backend
        run: npm ci

      - name: Run backend linting
        working-directory: ./backend
        run: npm run lint

      - name: Run backend type checking
        working-directory: ./backend
        run: npm run type-check || npm run tsc --noEmit

      - name: Run backend tests (parallel)
        working-directory: ./backend
        run: npm test -- --maxWorkers=50% --passWithNoTests

      - name: Generate backend test coverage (parallel)
        working-directory: ./backend
        run: npm run test:coverage -- --maxWorkers=50% || npm test -- --coverage --maxWorkers=50% || echo "No coverage configured"

  sonarqube-frontend:
    name: 📊 SonarQube Frontend
    runs-on: ubuntu-latest
    needs: [ detect-changes, test-frontend ]
    if: always() && needs.detect-changes.outputs.frontend-changed == 'true' && secrets.SONAR_TOKEN != ''
    env:
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Cache frontend node_modules
        uses: actions/cache@v4
        with:
          path: frontend/node_modules
          key: ${{ runner.os }}-frontend-${{ hashFiles('frontend/package.json') }}
          restore-keys: |
            ${{ runner.os }}-frontend-

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Generate test coverage for SonarQube (parallel)
        working-directory: ./frontend
        run: npm run test:coverage -- --maxWorkers=50% || npm test -- --coverage --maxWorkers=50% || echo "No coverage configured"

      - name: Run SonarQube Scan (Frontend)
        if: success()
        uses: SonarSource/sonarqube-scan-action@master
        with:
          projectBaseDir: frontend
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      - name: SonarQube Quality Gate (Frontend)
        if: success()
        uses: sonarsource/sonarqube-quality-gate-action@master
        with:
          scanMetadataReportFile: frontend/.scannerwork/report-task.txt
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  sonarqube-backend:
    name: 📊 SonarQube Backend
    runs-on: ubuntu-latest
    needs: [ detect-changes, test-backend ]
    if: always() && needs.detect-changes.outputs.backend-changed == 'true' && secrets.SONAR_TOKEN != ''
    env:
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
      CLERK_WEBHOOK_SECRET: ${{ secrets.CLERK_WEBHOOK_SECRET }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install backend dependencies
        working-directory: ./backend
        run: npm ci

      - name: Generate test coverage for SonarQube (parallel)
        working-directory: ./backend
        run: npm run test:coverage -- --maxWorkers=50% || npm test -- --coverage --maxWorkers=50% || echo "No coverage configured"

      - name: Run SonarQube Scan (Backend)
        if: success()
        uses: SonarSource/sonarqube-scan-action@master
        with:
          projectBaseDir: backend
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      - name: SonarQube Quality Gate (Backend)
        if: success()
        uses: sonarsource/sonarqube-quality-gate-action@master
        with:
          scanMetadataReportFile: backend/.scannerwork/report-task.txt
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  build-frontend:
    name: 🛠 Build frontend
    runs-on: ubuntu-latest
    needs: [ detect-changes, test-frontend ]
    if: needs.detect-changes.outputs.frontend-changed == 'true' && needs.test-frontend.result == 'success'
    env:
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
      NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Cache frontend node_modules
        uses: actions/cache@v4
        with:
          path: frontend/node_modules
          key: ${{ runner.os }}-frontend-${{ hashFiles('frontend/package.json') }}
          restore-keys: |
            ${{ runner.os }}-frontend-

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build frontend application
        working-directory: ./frontend
        run: npm run build

  build-backend:
    name: 🛠 Build backend
    runs-on: ubuntu-latest
    needs: [ detect-changes, test-backend ]
    if: needs.detect-changes.outputs.backend-changed == 'true' && needs.test-backend.result == 'success'
    env:
      CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
      CLERK_WEBHOOK_SECRET: ${{ secrets.CLERK_WEBHOOK_SECRET }}
      FRONTEND_URL: ${{ secrets.FRONTEND_URL }}
      GMAIL_USER: ${{ secrets.GMAIL_USER }}
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
      FROM_EMAIL: ${{ secrets.FROM_EMAIL }}
      FROM_NAME: ${{ secrets.FROM_NAME }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Cache backend node_modules
        uses: actions/cache@v4
        with:
          path: backend/node_modules
          key: ${{ runner.os }}-backend-${{ hashFiles('backend/package.json') }}
          restore-keys: |
            ${{ runner.os }}-backend-

      - name: Install backend dependencies
        working-directory: ./backend
        run: npm ci

      - name: Build backend application
        working-directory: ./backend
        run: npm run build

  docker-build-frontend:
    name: 🐳 Docker Build Frontend
    runs-on: ubuntu-latest
    needs: [ detect-changes, build-frontend ]
    if: needs.detect-changes.outputs.frontend-changed == 'true' && needs.build-frontend.result == 'success'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build frontend Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: finance4all-frontend:ci-test
          cache-from: type=gha
          cache-to: type=gha,mode=max

  docker-build-backend:
    name: 🐳 Docker Build Backend
    runs-on: ubuntu-latest
    needs: [ detect-changes, build-backend ]
    if: needs.detect-changes.outputs.backend-changed == 'true' && needs.build-backend.result == 'success'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: finance4all-backend:ci-test
          cache-from: type=gha
          cache-to: type=gha,mode=max