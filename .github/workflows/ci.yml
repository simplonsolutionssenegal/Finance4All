  sonarqube:
    name: 📊 SonarQube Analysis
    runs-on: ubuntu-latest
    needs: [detect-changes, test-frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - run: |
          curl -sSLo sonar-scanner.zip https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-cli-5.0.1.3006-linux.zip
          unzip sonar-scanner.zip
          sudo mv sonar-scanner-5.0.1.3006-linux /opt/sonar-scanner
          sudo ln -s /opt/sonar-scanner/bin/sonar-scanner /usr/local/bin/sonar-scanner
      - env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          sonar-scanner \
            -Dsonar.projectKey=simplon-finance4all \
            -Dsonar.sources=. \
            -Dsonar.host.url="${{ secrets.SONAR_HOST_URL }}" \
            -Dsonar.login="${{ secrets.SONAR_PASSWORD }}"



  build-frontend:
    name: 🛠 Build frontend
    runs-on: ubuntu-latest
    needs: [detect-changes, test-frontend, sonarqube]
    if: needs.detect-changes.outputs.frontend-changed == 'true' && needs.test-frontend.result == 'success' && needs.sonarqube.result == 'success'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: |
          rm -rf node_modules
          npm ci
          npm rebuild lightningcss --force

      - name: Build frontend application
        working-directory: ./frontend
        run: npm run build

