name: CI-Build

on:
  push:
    branches: [main]
  pull_request:

  workflow_call:
    secrets:
      SONAR_TOKEN:
        description: 'SonarQube token for analysis'
        required: false
      INFISICAL_CLIENT_ID:
        description: 'Infisical Machine Identity Client ID'
        required: true
      INFISICAL_CLIENT_SECRET:
        description: 'Infisical Machine Identity Client Secret'
        required: true
    outputs:
      frontend-changed:
        description: "Frontend changed"
        value: ${{ jobs.detect-changes.outputs.frontend-changed }}
      backend-changed:
        description: "Backend changed"
        value: ${{ jobs.detect-changes.outputs.backend-changed }}
      build-success:
        description: "Build successful"
        value: ${{ jobs.test-and-build-frontend.result == 'success' && jobs.test-and-build-backend.result == 'success' }}
      sonar-success:
        description: "SonarQube analysis successful"
        value: ${{ jobs.sonarqube-frontend.result == 'success' && jobs.sonarqube-backend.result == 'success' }}

permissions:
  contents: read
  pull-requests: read
  actions: read

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      frontend-changed: ${{ steps.changes.outputs.frontend }}
      backend-changed: ${{ steps.changes.outputs.backend }}
      any-changed: ${{ steps.changes.outputs.frontend == 'true' || steps.changes.outputs.backend == 'true' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Detect changes
        uses: dorny/paths-filter@v2
        id: changes
        with:
          filters: |
            frontend:
              - 'frontend/**'
              - 'frontend/package.json'
            backend:
              - 'backend/**'
              - 'backend/package.json'



  test-and-build-frontend:
    name: 🧪 Test & Build Frontend
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.frontend-changed == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Fetch secrets from Infisical
        uses: Infisical/secrets-action@v1.0.7
        with:
          domain: https://secrets.simplonprojet.com
          client-id: ${{ secrets.INFISICAL_CLIENT_ID }}
          client-secret: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          project-slug: finance4all
          env-slug: dev

      - name: Map CLERK_PUBLISHABLE_KEY for frontend
        run: echo "NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${CLERK_PUBLISHABLE_KEY}" >> $GITHUB_ENV

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Cache frontend node_modules
        uses: actions/cache@v4
        with:
          path: frontend/node_modules
          key: ${{ runner.os }}-frontend-node-modules-${{ hashFiles('frontend/package.json') }}
          restore-keys: |
            ${{ runner.os }}-frontend-node-modules-

      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: |
            frontend/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('frontend/package.json') }}-${{ hashFiles('frontend/**/*.js', 'frontend/**/*.jsx', 'frontend/**/*.ts', 'frontend/**/*.tsx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('frontend/package.json') }}-

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run frontend linting
        working-directory: ./frontend
        run: npm run lint

      - name: Run frontend type checking
        working-directory: ./frontend
        run: npm run type-check || npm run tsc --noEmit

      - name: Run frontend tests with coverage
        working-directory: ./frontend
        run: npm run test:coverage -- --maxWorkers=50% --passWithNoTests || npm test -- --coverage --maxWorkers=50% --passWithNoTests || echo "No coverage configured"

      - name: Upload coverage for SonarQube
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: frontend-coverage
          path: frontend/coverage
          retention-days: 1

      - name: Build frontend application
        working-directory: ./frontend
        run: npm run build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Verify Docker image build (Frontend)
        working-directory: ./frontend
        run: |
          docker build \
            --no-cache \
            --build-arg NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL} \
            --build-arg NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY} \
            --build-arg CLERK_SECRET_KEY=${CLERK_SECRET_KEY} \
            -t finance4all-frontend:ci-test \
            -f Dockerfile \
            .
        env:
          DOCKER_BUILDKIT: 1

  test-and-build-backend:
    name: 🧪 Test & Build Backend
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.backend-changed == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Fetch app secrets from Infisical
        uses: Infisical/secrets-action@v1.0.7
        with:
          domain: https://secrets.simplonprojet.com
          client-id: ${{ secrets.INFISICAL_CLIENT_ID }}
          client-secret: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          project-slug: finance4all
          env-slug: dev

      - name: Fetch infra secrets from Infisical
        uses: Infisical/secrets-action@v1.0.7
        with:
          domain: https://secrets.simplonprojet.com
          client-id: ${{ secrets.INFISICAL_CLIENT_ID }}
          client-secret: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          project-slug: infrastructure
          env-slug: dev

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Cache backend node_modules
        uses: actions/cache@v4
        with:
          path: backend/node_modules
          key: ${{ runner.os }}-backend-node-modules-${{ hashFiles('backend/package.json') }}
          restore-keys: |
            ${{ runner.os }}-backend-node-modules-

      - name: Install backend dependencies
        working-directory: ./backend
        run: npm ci

      - name: Run backend linting
        working-directory: ./backend
        run: npm run lint

      - name: Run backend type checking
        working-directory: ./backend
        run: npm run type-check || npm run tsc --noEmit

      - name: Run backend tests with coverage
        working-directory: ./backend
        run: npm run test:coverage -- --maxWorkers=50% --passWithNoTests || npm test -- --coverage --maxWorkers=50% --passWithNoTests || echo "No coverage configured"

      - name: Upload coverage for SonarQube
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: backend-coverage
          path: backend/coverage
          retention-days: 1

      - name: Build backend application
        working-directory: ./backend
        run: npm run build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Verify Docker image build (Backend)
        working-directory: ./backend
        run: |
          docker build \
            --no-cache \
            -t finance4all-backend:ci-test \
            -f Dockerfile \
            .
        env:
          DOCKER_BUILDKIT: 1

  sonarqube-frontend:
    name: 📊 SonarQube Frontend
    runs-on: ubuntu-latest
    needs: [ detect-changes, test-and-build-frontend ]
    if: needs.detect-changes.outputs.frontend-changed == 'true' && needs.test-and-build-frontend.result == 'success'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download coverage artifact
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: frontend-coverage
          path: frontend/coverage

      - name: Run SonarQube Scan (Frontend)
        uses: SonarSource/sonarqube-scan-action@master
        with:
          projectBaseDir: frontend
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: SonarQube Quality Gate (Frontend)
        uses: sonarsource/sonarqube-quality-gate-action@master
        with:
          scanMetadataReportFile: frontend/.scannerwork/report-task.txt
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  sonarqube-backend:
    name: 📊 SonarQube Backend
    runs-on: ubuntu-latest
    needs: [ detect-changes, test-and-build-backend ]
    if: needs.detect-changes.outputs.backend-changed == 'true' && needs.test-and-build-backend.result == 'success'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download coverage artifact
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: backend-coverage
          path: backend/coverage

      - name: Run SonarQube Scan (Backend)
        uses: SonarSource/sonarqube-scan-action@master
        with:
          projectBaseDir: backend
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: SonarQube Quality Gate (Backend)
        uses: sonarsource/sonarqube-quality-gate-action@master
        with:
          scanMetadataReportFile: backend/.scannerwork/report-task.txt
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
