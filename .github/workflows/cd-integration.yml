name: Integration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [closed]

jobs:
  integration:
    name: Integration Continue
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.merged == true)
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install root dependencies
        run: npm ci

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: |
          rm -rf node_modules
          npm ci
          npm rebuild lightningcss --force

      - name: Install backend dependencies
        working-directory: ./backend
        run: npm ci

      - name: Run frontend linting
        working-directory: ./frontend
        run: npm run lint

      - name: Run frontend type checking
        working-directory: ./frontend
        run: npm run type-check || npm run tsc --noEmit

      - name: Run frontend tests
        working-directory: ./frontend
        run: npm test

      - name: Run backend linting
        working-directory: ./backend
        run: npm run lint

      - name: Run backend type checking
        working-directory: ./backend
        run: npm run type-check || npm run tsc --noEmit

      - name: Build frontend application
        working-directory: ./frontend
        run: npm run build

      - name: Build backend application
        working-directory: ./backend
        run: npm run build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Nexus Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.NEXUS_REGISTRY_URL }}
          username: ${{ secrets.NEXUS_USERNAME }}
          password: ${{ secrets.NEXUS_PASSWORD }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ secrets.NEXUS_REGISTRY_URL }}/finance4all-frontend:latest
            ${{ secrets.NEXUS_REGISTRY_URL }}/finance4all-frontend:main-${{ github.sha }}

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ${{ secrets.NEXUS_REGISTRY_URL }}/finance4all-backend:latest
            ${{ secrets.NEXUS_REGISTRY_URL }}/finance4all-backend:main-${{ github.sha }}

      - name: Notify deployment success
        run: |
          echo "Integration réussie!"
          echo "Frontend image: ${{ secrets.NEXUS_REGISTRY_URL }}/finance4all-frontend:main-${{ github.sha }}"
          echo "Backend image: ${{ secrets.NEXUS_REGISTRY_URL }}/finance4all-backend:main-${{ github.sha }}"