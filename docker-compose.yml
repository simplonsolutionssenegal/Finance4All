version: '3.8'

services:
  postgres:
    image: postgres:14
    container_name: finance4all_postgres
    environment:
      POSTGRES_USER: finance4all
      POSTGRES_PASSWORD: finance4All
      POSTGRES_DB: finance4All
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - finance4all_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finance4all"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: finance4all_backend
    environment:
      - NODE_ENV=development
      - PORT=5000
      - DATABASE_URL=postgresql://finance4all:finance4All@postgres:5432/finance4All?schema=public
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - finance4all_network
    volumes:
      - ./backend:/app
      - /app/node_modules
    command: npm run dev

networks:
  finance4all_network:
    driver: bridge

volumes:
  postgres_data:
