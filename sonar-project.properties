# Informations du projet principal
sonar.projectKey=finance4all
sonar.projectName=Finance4All
sonar.projectVersion=1.0.0

# Répertoires source
sonar.sources=frontend,backend
sonar.tests=frontend,backend

# Structure du monorepo
sonar.modules=frontend,backend
sonar.tests=frontend,backend

# Configuration Frontend
frontend.sonar.projectName=Finance4All Frontend
frontend.sonar.sources=./
frontend.sonar.tests=__test__
frontend.sonar.test.inclusions=**/*.test.js,**/*.test.ts,**/*.test.jsx,**/*.test.tsx
frontend.sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/coverage/**
frontend.sonar.typescript.lcov.reportPaths=coverage/lcov.info
frontend.sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Configuration Backend
backend.sonar.projectName=Finance4All Backend
backend.sonar.sources=src
backend.sonar.tests=test
backend.sonar.test.inclusions=**/*.test.js,**/*.test.ts,**/*.spec.js,**/*.spec.ts
backend.sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/coverage/**
backend.sonar.typescript.lcov.reportPaths=coverage/lcov.info
backend.sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Configuration générale
sonar.sourceEncoding=UTF-8
sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**

sonar.qualitygate.wait=true